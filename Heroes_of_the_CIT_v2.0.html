      stats:{ atk:3, def:4, sp:1, kn:1, archery:3, lead:3 }, spells:["stoneskin"],
      role:"Защитник • Крепкий тыл и высокий запас сил" },
    { id:"tv_u1", name:"Аудитор Грим", faction:"undead", visual:"dmitry", spec:"magic", weapon:"dark", startCount:8,
      stats:{ atk:2, def:2, sp:4, kn:4, archery:1, lead:1 }, spells:["curse","icebolt"],
      role:"Некромант • Проклятия и строгая отчётность" },
    { id:"tv_u2", name:"Страж Архива", faction:"undead", visual:"valentin", spec:"melee", weapon:"dark", startCount:7,
      stats:{ atk:4, def:4, sp:2, kn:2, archery:1, lead:1 }, spells:["curse","stoneskin"],
      role:"Рыцарь тьмы • Непробиваемая бюрократия" }
  ];

  const byId = id => POOL.find(p => p.id === id) || null;

  function ensureVisitors(t, force = false) {
    const wk = Math.floor((G.day - 1) / 7) + 1;
    if (!force && t.tavern && t.tavernWeek === wk) return;
    const taken = new Set(G.heroes.flatMap(h => Game.getPartyHeroes(h).map(x => x.name)));
    const avail = POOL.filter(p => !taken.has(p.name));
    const sameFac = avail.filter(p => p.faction === t.faction);
    const first = sameFac.length ? pick(sameFac) : (avail.length ? pick(avail) : pick(POOL));
    const rest = avail.filter(p => p.id !== first.id);
    const second = rest.length ? pick(rest) : POOL.find(p => p.id !== first.id);
    t.tavern = [first ? first.id : null, second ? second.id : null];
    t.tavernWeek = wk;
  }

  function makeHero(tpl, owner, x, y) {
    const fac = FACTIONS[tpl.faction] ? tpl.faction : "humans";
    const u0 = FACTION_UNITS[fac]?.[0]?.base?.id || null;
    const h = {
      id: uid(), templateId: tpl.id, owner, x, y, alive: true, isMain: false, isArmyOnly: false,
      faction: fac, name: tpl.name, visual: tpl.visual, spec: tpl.spec, weapon: tpl.weapon || "sword",
      level: 1, xp: 0, hp: 100, mana: 30, stats: { ...tpl.stats },
      spells: (tpl.spells || []).filter(id => SPELLS[id]),
      equip: {}, bag: [], companions: [],
      army: u0 ? [{ id: u0, count: tpl.startCount || 6 }] : [],
      move: 12, path: []
    };
    const st = getHeroStats(h);
    h.hp = st.maxHp; h.mana = st.maxMana; h.move = st.maxMove;
    return h;
  }

  function build(townId) {
    const t = G.towns.find(x => x.id === townId);
    if (!t || t.builtToday || t.tavernBuilt) return;
    const pl = G.players[t.owner];
    if (!Game.canAfford(pl, BUILD_COST)) return showToast("Недостаточно ресурсов для Таверны!");
    Game.spend(pl, BUILD_COST);
    t.tavernBuilt = true; t.builtToday = true;
    ensureVisitors(t, true);
    Sound.play("build"); showToast("🍺 Таверна построена! Загляните к новым героям.");
    TownUI.render();
  }

  function reroll(townId) {
    const t = G.towns.find(x => x.id === townId);
    if (!t || !t.tavernBuilt) return;
    const pl = G.players[t.owner];
    if (!Game.canAfford(pl, REROLL_COST)) return showToast("Для обновления нужно 200 золота!");
    Game.spend(pl, REROLL_COST);
    ensureVisitors(t, true);
    Sound.play("click"); showToast("🍺 В Таверну зашли новые путники!");
    TownUI.render();
  }

  function hire(townId, slotIdx, intoParty = false) {
    const t = G.towns.find(x => x.id === townId);
    if (!t || !t.tavernBuilt || !t.tavern?.[slotIdx]) return;
    const pl = G.players[t.owner], tpl = byId(t.tavern[slotIdx]);
    if (!tpl) return;
    if (Game.getAllHeroesOf(t.owner).length >= MAX_HEROES) return showToast(`Достигнут лимит героев (${MAX_HEROES})!`);
    if (!Game.canAfford(pl, HIRE_COST)) return showToast("Для найма героя нужно 2500 золота!");

    const visitH = G.heroes.find(h => h.owner === t.owner && h.alive && !h.isArmyOnly && h.x === t.x && h.y === t.y);
    if (intoParty) {
      if (!visitH) return showToast("Заведите героя в город, чтобы нанять прямо в его отряд!");
      if (Game.getPartyHeroes(visitH).length >= 4) return showToast("В отряде уже максимум 4 героя!");
      Game.spend(pl, HIRE_COST);
      const nh = makeHero(tpl, t.owner, visitH.x, visitH.y);
      nh.army.forEach(s => {
        if (visitH.army.find(x => x.id === s.id) || visitH.army.length < 6) addArmy(visitH.army, s.id, s.count);
        else if (t.garrison.find(x => x.id === s.id) || t.garrison.length < 6) addArmy(t.garrison, s.id, s.count);
      });
      nh.army = [];
      visitH.companions = [...(visitH.companions || []), nh];
      t.tavern[slotIdx] = null;
      Sound.play("fanfare"); showToast(`👑 ${nh.name} присоединился к отряду героя ${visitH.name}!`);
      return TownUI.render();
    }

    const occ = G.heroes.some(x => x.alive && x.x === t.x && x.y === t.y);
    const pos = occ ? Game.getFreeAdj(t.x, t.y) : { x: t.x, y: t.y };
    if (!pos) return showToast("У ворот города нет свободной клетки! Освободите место или наймите в отряд.");
    Game.spend(pl, HIRE_COST);
    const nh = makeHero(tpl, t.owner, pos.x, pos.y);
    G.heroes.push(nh);
    revealFog(t.owner, pos.x, pos.y, 4);
    G.selHeroId = nh.id;
    t.tavern[slotIdx] = null;
    Sound.play("fanfare"); showToast(`🍺 Нанят новый герой: ${nh.name}!`);
    TownUI.render();
  }

  function renderBuildRow(t) {
    const act = t.tavernBuilt ? `<span style="color:var(--success)">Построена</span>`
      : `<button class="btn btn-sm" ${t.builtToday ? "disabled" : ""} onclick="Tavern.build('${t.id}')">Построить (${fmtCost(BUILD_COST)})</button>`;
    return `<div class="item-row"><span>🍺 Таверна (найм доп. героев)</span>${act}</div>`;
  }

  function renderPanel(t, visitH) {
    if (!t.tavernBuilt) {
      return `<div style="font-size:12px;color:var(--text-dim);margin-top:8px;padding:6px 8px;background:#140f0a;border:1px dashed #4a3a26;border-radius:4px;">
        🍺 Постройте <b>Таверну</b> (${fmtCost(BUILD_COST)}), чтобы нанимать дополнительных героев и собирать отряды до 4 героев.</div>`;
    }
    ensureVisitors(t, false);
    const curCnt = Game.getAllHeroesOf(t.owner).length;
    const canJoin = visitH && Game.getPartyHeroes(visitH).length < 4;
    const cards = (t.tavern || []).map((id, idx) => {
      const p = id ? byId(id) : null;
      if (!p) return `<div class="item-row" style="opacity:0.55;"><span>🍺 Место свободно (новые гости на следующей неделе)</span></div>`;
      const u0 = FACTION_UNITS[p.faction]?.[0]?.base;
      return `<div class="item-row" style="gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;">
          <canvas class="tv-port" data-tid="${p.id}" width="44" height="44" style="width:44px;height:44px;border:1.5px solid var(--gold);border-radius:4px;flex-shrink:0;background:#100c08;"></canvas>
          <div style="min-width:0;">
            <b>${p.name}</b> <small style="color:var(--gold)">(${FACTIONS[p.faction].name})</small><br>
            <small style="color:var(--text-dim)">${p.role}</small><br>
            <small style="color:#8cd997">⚔️${p.stats.atk} 🛡️${p.stats.def} 🔮${p.stats.sp} 🏹${p.stats.archery}${u0 ? ` | +${u0.name} ×${p.startCount}` : ""}</small>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button class="btn btn-sm btn-gold" onclick="Tavern.hire('${t.id}',${idx},false)">🍺 Нанять (🪙2500)</button>
          ${canJoin ? `<button class="btn btn-sm" onclick="Tavern.hire('${t.id}',${idx},true)" title="Нанять сразу в отряд героя ${visitH.name}">👑 В отряд</button>` : ""}
        </div>
      </div>`;
    }).join("");
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;">
      <span style="font-size:13px;color:var(--gold);font-weight:bold;">🍺 Таверна (героев: ${curCnt}/${MAX_HEROES})</span>
      <button class="btn btn-sm" onclick="Tavern.reroll('${t.id}')" title="Пригласить других гостей">🔄 Обновить (🪙200)</button>
    </div><div style="display:flex;flex-direction:column;gap:6px;">${cards}</div>`;
  }

  function paintPortraits(root) {
    root.querySelectorAll("canvas.tv-port").forEach(cv => {
      const p = byId(cv.dataset.tid);
      if (p) GFX.drawHeroPortrait(cv, { faction: p.faction, visual: p.visual });
    });
  }

  return { build, reroll, hire, renderBuildRow, renderPanel, paintPortraits };
})();

const Market = (() => {
  const BUILD_COST = { gold: 500, wood: 5 };
  const VAL = { gold: 1, wood: 120, stone: 120, emeralds: 240, stardust: 240 };
  const KEYS = ["gold", "wood", "stone", "emeralds", "stardust"];
  let curTown = null, selFrom = "gold", selTo = "wood";

  function countMarkets(owner) {
    return Math.max(1, G.towns.filter(t => t.owner === owner && t.marketBuilt).length);
  }

  function getRate(owner) {
    const c = countMarkets(owner);
    return c >= 3 ? 0.75 : c === 2 ? 0.6 : 0.5;
  }

  function getDeal(from, to, owner) {
    if (!from || !to || from === to) return null;
    const rate = getRate(owner), c = countMarkets(owner);
    if (from === "gold") return { give: Math.round(VAL[to] / rate), get: 1 };
    if (to === "gold") return { give: 1, get: Math.round(VAL[from] * rate) };
    if (VAL[from] === VAL[to]) return c >= 3 ? { give: 3, get: 2 } : { give: 2, get: 1 };
    if (VAL[from] < VAL[to]) return c >= 3 ? { give: 3, get: 1 } : { give: 4, get: 1 };
    return c >= 3 ? { give: 2, get: 3 } : { give: 1, get: 1 };
  }

  function ensureModal() {
    let m = document.getElementById("modal-market");
    if (!m) {
      m = document.createElement("div"); m.id = "modal-market"; m.className = "modal";
      m.style.zIndex = "1200";
      m.innerHTML = `<div class="modal-box" style="max-width:720px;" id="modal-market-content"></div>`;
      document.body.appendChild(m);
    }
    return m;
  }

  function build(townId) {
    const t = G.towns.find(x => x.id === townId);
    if (!t || t.builtToday || t.marketBuilt) return;
    const pl = G.players[t.owner];
    if (!Game.canAfford(pl, BUILD_COST)) return showToast("Недостаточно ресурсов для постройки Рынка!");
    Game.spend(pl, BUILD_COST);
    t.marketBuilt = true; t.builtToday = true;
    Sound.play("build"); showToast("⚖️ Рынок построен! Теперь можно обменивать ресурсы.");
    TownUI.render();
  }

  function open(townId) {
    const t = G.towns.find(x => x.id === townId);
    if (!t || !t.marketBuilt) return;
    curTown = t;
    if (selFrom === selTo) selTo = selFrom === "gold" ? "wood" : "gold";
    Sound.play("click");
    ensureModal().classList.add("active");
    render();
  }

  function close() {
    document.getElementById("modal-market")?.classList.remove("active");
    curTown = null;
  }

  function pickFrom(k) {
    selFrom = k;
    if (selTo === k) selTo = k === "gold" ? "wood" : "gold";
    Sound.play("click"); render();
  }

  function pickTo(k) {
    if (k === selFrom) return;
    selTo = k;
    Sound.play("click"); render();
  }

  function trade(mult) {
    if (!curTown) return;
    const pl = G.players[curTown.owner], deal = getDeal(selFrom, selTo, curTown.owner);
    if (!deal) return;
    const maxTimes = Math.floor((pl.res[selFrom] || 0) / deal.give);
    const times = mult === "max" ? maxTimes : Math.min(mult, maxTimes);
    if (times <= 0) return showToast("Недостаточно ресурсов для обмена!");
    pl.res[selFrom] -= deal.give * times;
    pl.res[selTo] += deal.get * times;
    Sound.play("gold");
    showToast(`⚖️ Обмен: -${deal.give * times} ${RES_META[selFrom].icon} ➔ +${deal.get * times} ${RES_META[selTo].icon}`, 2000);
    render();
    TownUI.render();
  }

  function renderBuildRow(t) {
    const act = t.marketBuilt
      ? `<button class="btn btn-sm btn-gold" onclick="Market.open('${t.id}')">⚖️ Открыть Рынок</button>`
      : `<button class="btn btn-sm" ${t.builtToday ? "disabled" : ""} onclick="Market.build('${t.id}')">Построить (${fmtCost(BUILD_COST)})</button>`;
    return `<div class="item-row"><span>⚖️ Рынок (обмен ресурсов)</span>${act}</div>`;
  }

  function render() {
    if (!curTown) return;
    const box = document.getElementById("modal-market-content");
    const pl = G.players[curTown.owner], mCnt = countMarkets(curTown.owner), pct = Math.round(getRate(curTown.owner) * 100);
    const deal = getDeal(selFrom, selTo, curTown.owner);
    const maxTimes = deal ? Math.floor((pl.res[selFrom] || 0) / deal.give) : 0;

    const fromRows = KEYS.map(k => {
      const rm = RES_META[k], active = selFrom === k;
      return `<div class="item-row" onclick="Market.pickFrom('${k}')" style="cursor:pointer;border-color:${active ? "var(--gold)" : "#3f3020"};background:${active ? "rgba(224,184,76,0.14)" : ""};">
        <span>${rm.icon} <b>${rm.name}</b></span>
        <span style="color:var(--gold);font-weight:bold;">${pl.res[k]}</span>
      </div>`;
    }).join("");

    const toRows = KEYS.map(k => {
      const rm = RES_META[k], same = k === selFrom, active = selTo === k;
      const d = same ? null : getDeal(selFrom, k, curTown.owner);
      const rateTxt = d ? `${d.give}${RES_META[selFrom].icon} ➔ ${d.get}${rm.icon}` : "—";
      return `<div class="item-row" onclick="${same ? "" : `Market.pickTo('${k}')`}" style="cursor:${same ? "default" : "pointer"};opacity:${same ? 0.4 : 1};border-color:${active ? "#54eb7a" : "#3f3020"};background:${active ? "rgba(84,235,122,0.12)" : ""};">
        <span>${rm.icon} <b>${rm.name}</b></span>
        <span style="font-size:12px;color:#e8d8b8;">${rateTxt}</span>
      </div>`;
    }).join("");

    box.innerHTML = `
      <div class="modal-head">
        <div><h2>⚖️ Рынок ресурсов — ${curTown.name}</h2>
          <div style="font-size:12px;color:var(--text-dim);">Ваших рынков: <b style="color:var(--gold)">${mCnt}</b> • Выгодность курса: <b style="color:#7ce08b">${pct}%</b> ${mCnt < 3 ? "(больше рынков = лучше курс!)" : "(максимум!)"}</div>
        </div>
        <button class="btn btn-sm" onclick="Market.close()">✕ Закрыть (Esc)</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div class="panel-box">
          <div style="font-size:13px;color:var(--gold);font-weight:bold;margin-bottom:6px;">📤 Отдаёте:</div>
          <div style="display:flex;flex-direction:column;gap:5px;">${fromRows}</div>
        </div>
        <div class="panel-box">
          <div style="font-size:13px;color:#7ce08b;font-weight:bold;margin-bottom:6px;">📥 Получаете:</div>
          <div style="display:flex;flex-direction:column;gap:5px;">${toRows}</div>
        </div>
      </div>
      <div class="panel-box" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div style="font-size:13px;">
          ${deal ? `Сделка: <b style="color:#ff9c75">-${deal.give} ${RES_META[selFrom].icon}</b> ➔ <b style="color:#7ce08b">+${deal.get} ${RES_META[selTo].icon}</b> <small style="color:var(--text-dim)">(доступно: ×${maxTimes})</small>` : "Выберите ресурсы для обмена"}
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm btn-gold" ${maxTimes < 1 ? "disabled" : ""} onclick="Market.trade(1)">Обменять ×1</button>
          <button class="btn btn-sm" ${maxTimes < 5 ? "disabled" : ""} onclick="Market.trade(5)">×5</button>
          <button class="btn btn-sm" ${maxTimes < 1 ? "disabled" : ""} onclick="Market.trade('max')">Макс (×${maxTimes})</button>
        </div>
      </div>`;
  }

  window.addEventListener("keydown", e => {
    if (e.code === "Escape" && document.getElementById("modal-market")?.classList.contains("active")) {
      e.stopImmediatePropagation(); close();
    }
  }, true);

  return { build, open, close, pickFrom, pickTo, trade, renderBuildRow };
})();

const TownUI = (() => {
  let curTown = null;

  function getVisitingHero(town) {
    if (!town) return null;
    return G.heroes.find(h => h.owner === town.owner && h.alive && !h.isArmyOnly && h.x === town.x && h.y === town.y) || null;
  }

  function paintIcons(root) {
    if (typeof GFX.renderUnitIcons === "function") return GFX.renderUnitIcons(root);
    root.querySelectorAll("canvas.u-ico").forEach(cv => {
      const u = UNIT_MAP[cv.dataset.uid];
      if (!u) return;
      const g = cv.getContext("2d"), w = cv.width, h = cv.height, f = FACTIONS[u.faction] || FACTIONS.humans;
      const grd = g.createRadialGradient(w / 2, h * 0.45, 2, w / 2, h / 2, w * 0.72);
      grd.addColorStop(0, u.upg ? f.accent : f.color); grd.addColorStop(0.55, f.color); grd.addColorStop(1, "#120c08");
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      GFX.drawUnit(g, 2, 4, Math.min(w, h) - 4, u, 1, u.upg, 1);
    });
  }

  function open(town) {
    if (!town || !G) return;
    if (!town.garrison) town.garrison = [];
    curTown = town;
    G.selTownId = town.id;
    Sound.playTownMusic(town.faction);
    document.getElementById("modal-town").classList.add("active");
    render();
  }

  function close() {
    document.getElementById("modal-town").classList.remove("active");
    curTown = null;
    if (G) { Sound.playMapMusic(G.biome); MapUI.updateAll(); }
  }

  function buildAdmin() {
    const pl = G.players[curTown.owner];
    if (curTown.builtToday || curTown.admin >= 3) return;
    const nxt = ADMIN_LEVELS[curTown.admin];
    if (!Game.canAfford(pl, nxt.cost)) return showToast("Недостаточно ресурсов!");
    Game.spend(pl, nxt.cost); curTown.admin++; curTown.builtToday = true;
    Sound.play("build"); showToast(`🔨 Построено: ${nxt.name}!`); render();
  }

  function buildGuild() {
    const pl = G.players[curTown.owner];
    if (curTown.builtToday || curTown.guild >= 3) return;
    const nxt = GUILD_LEVELS[curTown.guild];
    if (!Game.canAfford(pl, nxt.cost)) return showToast("Недостаточно ресурсов!");
    Game.spend(pl, nxt.cost); curTown.guild++; curTown.builtToday = true;
    Sound.play("build"); showToast(`🔮 Построено: ${nxt.name}!`); render();
  }

  function buildDwelling(idx) {
    const pl = G.players[curTown.owner], lvl = curTown.dwellings[idx];
    if (curTown.builtToday || lvl >= 2) return;
    const cost = DWELLING_COSTS[idx + 1][lvl];
    if (!Game.canAfford(pl, cost)) return showToast("Недостаточно ресурсов!");
    Game.spend(pl, cost); curTown.dwellings[idx]++; curTown.builtToday = true;
    const fu = FACTION_UNITS[curTown.faction][idx];
    if (lvl === 0) curTown.stock[idx] += fu.base.growth;
    Sound.play("build");
    showToast(`🏗️ ${lvl === 0 ? "Построено жилище" : "Улучшено жилище"}: ${(lvl === 0 ? fu.base : fu.upg).name}!`);
    render();
  }

  function recruit(idx, all) {
    const pl = G.players[curTown.owner], h = getVisitingHero(curTown);
    const targetArmy = h ? h.army : curTown.garrison;
    const lvl = curTown.dwellings[idx], avail = curTown.stock[idx];
    if (lvl === 0 || avail <= 0) return;
    const fu = FACTION_UNITS[curTown.faction][idx];
    const u = lvl === 2 ? fu.upg : fu.base;
    if (!targetArmy.find(s => s.id === u.id) && targetArmy.length >= 6) {
      return showToast(h ? "В армии героя нет свободных слотов (макс. 6)!" : "В гарнизоне города нет свободных слотов (макс. 6)!");
    }
    let bought = 0;
    const limit = all ? avail : 1;
    while (bought < limit && Game.canAfford(pl, u.cost)) {
      Game.spend(pl, u.cost); curTown.stock[idx]--; addArmy(targetArmy, u.id, 1); bought++;
    }
    if (bought > 0) {
      Sound.play("gold");
      showToast(`⚔️ Нанято ${h ? `в армию ${h.name}` : "в гарнизон города"}: ${u.name} ×${bought}`);
      render();
    } else showToast("Недостаточно ресурсов для найма!");
  }

  function upgradeStack(idx) {
    const pl = G.players[curTown.owner], h = getVisitingHero(curTown);
    if (curTown.dwellings[idx] < 2) return;
    const fu = FACTION_UNITS[curTown.faction][idx];
    let army = h && h.army.find(s => s.id === fu.base.id) ? h.army : curTown.garrison;
    const stack = army.find(s => s.id === fu.base.id);
    if (!stack) return;
    const totalCost = multCost(getUpgradeUnitCost(fu.base, fu.upg), stack.count);
    if (!Game.canAfford(pl, totalCost)) return showToast(`Нужно для улучшения: ${fmtCost(totalCost)}`);
    Game.spend(pl, totalCost);
    const exUpg = army.find(s => s.id === fu.upg.id);
    if (exUpg) { exUpg.count += stack.count; army.splice(army.indexOf(stack), 1); }
    else { stack.id = fu.upg.id; }
    Sound.play("build"); showToast(`⬆️ Отряд улучшен до «${fu.upg.name}»!`); render();
  }

  function garrisonToHero(idx) {
    const h = getVisitingHero(curTown), s = curTown.garrison[idx];
    if (!h || !s) return;
    if (!h.army.find(x => x.id === s.id) && h.army.length >= 6) return showToast("В армии героя нет свободных слотов (макс. 6)!");
    addArmy(h.army, s.id, s.count);
    curTown.garrison.splice(idx, 1);
    Sound.play("click"); render();
  }

  function garrisonAllToHero() {
    const h = getVisitingHero(curTown);
    if (!h || !curTown.garrison.length) return;
    const rest = [];
    let moved = 0;
    curTown.garrison.forEach(s => {
      if (h.army.find(x => x.id === s.id) || h.army.length < 6) { addArmy(h.army, s.id, s.count); moved++; }
      else rest.push(s);
    });
    curTown.garrison = rest;
    if (moved) { Sound.play("click"); showToast(`⚔️ Передано в армию ${h.name}`); }
    else showToast("У героя заняты все 6 слотов!");
    render();
  }

  function garrisonToMap(idx) {
    const s = curTown.garrison[idx];
    if (!s) return;
    const spot = Game.getFreeAdj(curTown.x, curTown.y);
    if (!spot) return showToast("Вокруг города нет свободной клетки для вывода отряда!");
    curTown.garrison.splice(idx, 1);
    const p = Game.spawnArmyParty(curTown.owner, spot.x, spot.y, [s]);
    if (p) { G.selHeroId = p.id; Sound.play("step"); showToast(`🚩 Отряд без героя выведен из замка: ${UNIT_MAP[s.id].name} ×${s.count}`); }
    render();
  }

  function garrisonAllToMap() {
    if (!curTown.garrison.length) return;
    const spot = Game.getFreeAdj(curTown.x, curTown.y);
    if (!spot) return showToast("Вокруг города нет свободной клетки для вывода отряда!");
    const send = curTown.garrison.splice(0, curTown.garrison.length);
    const p = Game.spawnArmyParty(curTown.owner, spot.x, spot.y, send);
    if (p) { G.selHeroId = p.id; Sound.play("step"); showToast("🚩 Весь гарнизон выведен на карту как отряд без героя!"); }
    render();
  }

  function buySpell(spellId) {
    const pl = G.players[curTown.owner], h = getVisitingHero(curTown), sp = SPELLS[spellId];
    if (!h || !sp) return showToast("Заведите героя в город, чтобы изучить заклинание!");
    const learners = Game.getPartyHeroes(h).filter(ph => !ph.spells.includes(spellId));
    if (!learners.length) return;
    const cost = { gold: sp.lvl * 450 };
    if (!Game.canAfford(pl, cost)) return showToast("Недостаточно золота!");
    Game.spend(pl, cost);
    learners.forEach(ph => ph.spells.push(spellId));
    Sound.play("magic"); showToast(`📖 Изучено заклинание: ${sp.name}!`); render();
  }

  function resurrectHero(heroId) {
    const pl = G.players[curTown.owner];
    const h = G.heroes.find(x => x.id === heroId && x.owner === curTown.owner && !x.isArmyOnly && !x.alive);
    if (!h) return;
    const cost = { gold: 1000 };
    if (!Game.canAfford(pl, cost)) return showToast("Для воскрешения нужно 1000 золота!");
    const townBusy = G.heroes.some(x => x.alive && x.x === curTown.x && x.y === curTown.y);
    const pos = townBusy ? Game.getFreeAdj(curTown.x, curTown.y) : { x: curTown.x, y: curTown.y };
    if (!pos) return showToast("В городе и рядом нет свободной клетки для воскрешения!");
    Game.spend(pl, cost);
    const st = getHeroStats(h);
    h.alive = true; h.hp = st.maxHp; h.mana = st.maxMana; h.move = st.maxMove;
    h.x = pos.x; h.y = pos.y; G.selHeroId = h.id;
    Sound.play("heal"); showToast(`✨ ${h.name} воскрешён!`); render();
  }

  function render() {
    if (!curTown) return;
    const t = curTown, pl = G.players[t.owner], f = FACTIONS[t.faction], h = getVisitingHero(t);
    const fu = FACTION_UNITS[t.faction];
    const deadHeroes = G.heroes.filter(x => x.owner === t.owner && !x.isArmyOnly && !x.alive);
    const resLine = Object.entries(RES_META).map(([k, m]) => `${m.icon}<b>${pl.res[k]}</b>`).join(" &nbsp;");

    const adminBtn = t.admin < 3
      ? `<button class="btn btn-sm" ${t.builtToday ? "disabled" : ""} onclick="TownUI.buildAdmin()">Построить (${fmtCost(ADMIN_LEVELS[t.admin].cost)})</button>`
      : `<span style="color:var(--success)">Максимум</span>`;
    const guildBtn = t.guild < 3
      ? `<button class="btn btn-sm" ${t.builtToday ? "disabled" : ""} onclick="TownUI.buildGuild()">Построить (${fmtCost(GUILD_LEVELS[t.guild].cost)})</button>`
      : `<span style="color:var(--success)">Макс. (Ур.3)</span>`;

    const dwellRows = fu.map((pair, i) => {
      const lvl = t.dwellings[i];
      const title = lvl === 0 ? `Тир ${i + 1}: ${pair.base.name} (не построено)` : lvl === 1 ? `Тир ${i + 1} [Ур.1]: ${pair.base.name}` : `Тир ${i + 1} [Ур.2]: ${pair.upg.name}`;
      const act = lvl < 2
        ? `<button class="btn btn-sm" ${t.builtToday ? "disabled" : ""} onclick="TownUI.buildDwelling(${i})">${lvl === 0 ? "Построить" : "Улучшить"} (${fmtCost(DWELLING_COSTS[i + 1][lvl])})</button>`
        : `<span style="color:var(--gold)">★ Ур.2</span>`;
      return `<div class="item-row"><span>${title}</span>${act}</div>`;
    }).join("");

    const recruitRows = fu.map((pair, i) => {
      const lvl = t.dwellings[i], u = lvl === 2 ? pair.upg : pair.base;
      const baseStack = lvl === 2 ? ((h && h.army.find(s => s.id === pair.base.id)) || t.garrison.find(s => s.id === pair.base.id)) : null;
      const upgBtn = baseStack
        ? `<button class="btn btn-sm btn-gold" onclick="TownUI.upgradeStack(${i})">⬆ Апгрейд ×${baseStack.count} (${fmtCost(multCost(getUpgradeUnitCost(pair.base, pair.upg), baseStack.count))})</button>` : "";
      const brd = u.upg ? "var(--gold)" : "#5c4629";
      const ico = `<canvas class="u-ico" data-uid="${u.id}" width="44" height="44" style="width:44px;height:44px;border:1.5px solid ${brd};border-radius:4px;flex-shrink:0;background:#100c08;"></canvas>`;
      if (lvl === 0) return `<div class="item-row" style="opacity:0.5;"><div style="display:flex;align-items:center;gap:8px;">${ico}<div><b>${pair.base.name}</b><br><span style="color:var(--text-dim)">Постройте жилище Тир ${i + 1}</span></div></div><span>🔒</span></div>`;
      return `<div class="item-row">
        <div style="display:flex;align-items:center;gap:8px;">${ico}
          <div><b>${u.name}</b> <span style="color:var(--gold)">(доступно: ${t.stock[i]})</span><br>
          <span style="color:var(--text-dim)">${fmtCost(u.cost)} | ${u.type === "ranged" ? "🏹 Стрелок" : "⚔️ Ближний"}${u.alt ? " | ★ " + u.alt.name : ""}</span></div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">
          ${upgBtn}
          <button class="btn btn-sm" ${t.stock[i] <= 0 ? "disabled" : ""} onclick="TownUI.recruit(${i},false)">+1</button>
          <button class="btn btn-sm btn-gold" ${t.stock[i] <= 0 ? "disabled" : ""} onclick="TownUI.recruit(${i},true)">Все</button>
        </div></div>`;
    }).join("");

    const garRows = t.garrison.length ? t.garrison.map((s, i) => {
      const u = UNIT_MAP[s.id], brd = u.upg ? "var(--gold)" : "#5c4629";
      return `<div class="item-row">
        <div style="display:flex;align-items:center;gap:7px;">
          <canvas class="u-ico" data-uid="${u.id}" width="34" height="34" style="width:34px;height:34px;border:1.5px solid ${brd};border-radius:4px;background:#100c08;"></canvas>
          <span><b>${u.name}</b> <b style="color:var(--gold)">×${s.count}</b></span>
        </div>
        <div style="display:flex;gap:4px;">
          ${h ? `<button class="btn btn-sm btn-gold" onclick="TownUI.garrisonToHero(${i})">➔ Герою</button>` : ""}
          <button class="btn btn-sm" onclick="TownUI.garrisonToMap(${i})" title="Вывести отряд без героя на карту">🚩 На карту</button>
        </div></div>`;
    }).join("") : `<div style="font-size:12px;color:var(--text-dim);">Гарнизон пуст</div>`;

    const party = h ? Game.getPartyHeroes(h) : [];
    const spellsHtml = t.guild > 0 && h
      ? SPELL_LIST.filter(s => s.lvl <= t.guild && party.some(ph => !ph.spells.includes(s.id))).map(s =>
        `<div class="item-row"><span>✨ <b>${s.name}</b> (Ур.${s.lvl}, ${s.cost}м) — ${s.desc}</span>
        <button class="btn btn-sm" onclick="TownUI.buySpell('${s.id}')">Купить (🪙${s.lvl * 450})</button></div>`).join("")
      : "";

    const deadHtml = deadHeroes.map(dh =>
      `<div class="item-row" style="border-color:var(--danger);"><span>💀 ${dh.name} пал в бою</span>
      <button class="btn btn-sm btn-gold" onclick="TownUI.resurrectHero('${dh.id}')">✨ Воскресить (🪙1000)</button></div>`).join("");

    const box = document.getElementById("town-content");
    box.innerHTML = `
      <div class="modal-head">
        <div><h2>🏰 ${t.name} — ${f.name}</h2><div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${resLine}</div></div>
        <div style="display:flex;gap:6px;">
          ${t.marketBuilt ? `<button class="btn btn-sm btn-gold" onclick="Market.open('${t.id}')">⚖️ Рынок</button>` : ""}
          <button class="btn btn-sm" onclick="TownUI.close()">✕ Закрыть</button>
        </div>
      </div>
      <div class="town-layout">
        <div>
          <canvas id="town-canvas" width="600" height="240"></canvas>
          <div style="font-size:13px;color:var(--gold);margin:8px 0 4px;font-weight:bold;">
            Постройки ${t.builtToday ? "(сегодня уже построено)" : "(можно построить 1 здание за ход)"}
          </div>
          <div class="build-list">
            <div class="item-row"><span>🏛️ ${ADMIN_LEVELS[t.admin - 1].name} (+${ADMIN_LEVELS[t.admin - 1].income} 🪙/ход)</span>${adminBtn}</div>
            <div class="item-row"><span>🔮 Гильдия магов (Ур. ${t.guild}/3)</span>${guildBtn}</div>
            ${Tavern.renderBuildRow(t)}
            ${Market.renderBuildRow(t)}
            ${dwellRows}
          </div>
        </div>
        <div>
          ${deadHtml}
          <div style="font-size:12px;padding:6px 8px;border-radius:4px;margin-bottom:6px;background:#16100b;border:1px solid ${h ? "#45a35d" : "#8a6c27"};">
            ${h ? `🧙 <b>В городе: ${h.name}</b> — найм идёт сразу в армию героя.` : `⚠️ <b>Героя нет в городе</b> — найм идёт в гарнизон (заведите героя в замок или выведите отряд на карту без героя).`}
          </div>
          <div class="recruit-list" style="max-height:185px;">${recruitRows}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;">
            <span style="font-size:13px;color:var(--gold);font-weight:bold;">🛡️ Гарнизон города (${t.garrison.length}/6)</span>
            <div style="display:flex;gap:4px;">
              ${h && t.garrison.length ? `<button class="btn btn-sm btn-gold" onclick="TownUI.garrisonAllToHero()">Все ➔ Герою</button>` : ""}
              ${t.garrison.length ? `<button class="btn btn-sm" onclick="TownUI.garrisonAllToMap()">🚩 Весь гарнизон на карту</button>` : ""}
            </div>
          </div>
          <div class="build-list" style="max-height:105px;">${garRows}</div>
          ${Tavern.renderPanel(t, h)}
          ${t.guild > 0 ? `<div style="font-size:13px;color:var(--gold);margin:8px 0 4px;font-weight:bold;">📖 Гильдия магов</div>
          <div class="build-list" style="max-height:105px;">${h ? (spellsHtml || "<div style='font-size:12px;color:var(--text-dim);'>Все доступные заклинания уже изучены.</div>") : "<div style='font-size:12px;color:var(--text-dim);'>Заведите героя в город, чтобы покупать заклинания.</div>"}</div>` : ""}
        </div>
      </div>`;
    GFX.drawTownScene(document.getElementById("town-canvas"), t);
    paintIcons(box);
    Tavern.paintPortraits(box);
    MapUI.updateHUD();
  }

  return {
    open, close, render, buildAdmin, buildGuild, buildDwelling, recruit, upgradeStack,
    garrisonToHero, garrisonAllToHero, garrisonToMap, garrisonAllToMap, buySpell, resurrectHero
  };
})();

function paintUnitIcons(root) {
  if (typeof GFX.renderUnitIcons === "function") return GFX.renderUnitIcons(root);
  root.querySelectorAll("canvas.u-ico").forEach(cv => {
    const u = UNIT_MAP[cv.dataset.uid];
    if (!u) return;
    const g = cv.getContext("2d"), w = cv.width, h = cv.height, f = FACTIONS[u.faction] || FACTIONS.humans;
    const grd = g.createRadialGradient(w / 2, h * 0.45, 2, w / 2, h / 2, w * 0.72);
    grd.addColorStop(0, u.upg ? f.accent : f.color); grd.addColorStop(0.55, f.color); grd.addColorStop(1, "#120c08");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    GFX.drawUnit(g, 2, 4, Math.min(w, h) - 4, u, 1, u.upg, 1);
  });
}

const HeroUI = (() => {
  let curParty = null, activeIdx = 0;

  const getActiveHero = () => {
    if (!curParty || curParty.isArmyOnly) return null;
    const list = Game.getPartyHeroes(curParty);
    if (activeIdx >= list.length) activeIdx = 0;
    return list[activeIdx] || list[0];
  };

  function open(ent) {
    curParty = ent || Game.getSelectedHero();
    if (!curParty) return showToast("Нет выбранного героя или отряда!");
    activeIdx = 0;
    Sound.play("click");
    document.getElementById("modal-hero").classList.add("active");
    render();
  }

  function close() {
    document.getElementById("modal-hero").classList.remove("active");
    curParty = null;
    if (G) MapUI.updateAll();
  }

  function selectTab(idx) { activeIdx = idx; Sound.play("click"); render(); }

  function kickCompanion(compIdx) {
    if (!curParty || curParty.isArmyOnly) return;
    if (Game.splitCompanion(curParty, compIdx)) { activeIdx = 0; render(); }
  }

  function unequip(slotKey) {
    const h = getActiveHero();
    if (!h || !h.equip[slotKey]) return;
    h.bag.push(h.equip[slotKey]); h.equip[slotKey] = null;
    const st = getHeroStats(h);
    h.hp = Math.min(h.hp, st.maxHp); h.mana = Math.min(h.mana, st.maxMana);
    Sound.play("click"); render();
  }

  function equipFromBag(bagIdx) {
    const h = getActiveHero();
    if (!h || bagIdx < 0 || bagIdx >= h.bag.length) return;
    const artId = h.bag[bagIdx], art = ART_MAP[artId];
    if (!art) return;
    const slots = EQUIP_SLOTS.filter(s => s.accept === art.slot);
    const target = slots.find(s => !h.equip[s.key]) || slots[0];
    if (!target) return;
    h.bag.splice(bagIdx, 1);
    if (h.equip[target.key]) h.bag.push(h.equip[target.key]);
    h.equip[target.key] = artId;
    h.hp = Math.min(getHeroStats(h).maxHp, h.hp + (art.bonus.hp || 0));
    Sound.play("click"); render();
  }

  function moveStack(idx, dir) {
    if (!curParty) return;
    const nxt = idx + dir;
    if (nxt < 0 || nxt >= curParty.army.length) return;
    [curParty.army[idx], curParty.army[nxt]] = [curParty.army[nxt], curParty.army[idx]];
    Sound.play("click"); render(); MapUI.updateHUD();
  }

  function splitStack(idx) {
    if (!curParty || curParty.army.length >= 6) return showToast("Нет свободных слотов (макс. 6)!");
    const s = curParty.army[idx];
    if (!s || s.count < 2) return showToast("Для разделения нужно минимум 2 бойца!");
    const half = Math.floor(s.count / 2);
    s.count -= half;
    curParty.army.splice(idx + 1, 0, { id: s.id, count: half });
    Sound.play("click"); render(); MapUI.updateHUD();
  }

  function mergeStack(idx) {
    if (!curParty || !curParty.army[idx]) return;
    const target = curParty.army[idx];
    let added = 0;
    curParty.army = curParty.army.filter((s, i) => {
      if (i !== idx && s.id === target.id) { added += s.count; return false; }
      return true;
    });
    if (added > 0) { target.count += added; Sound.play("click"); render(); MapUI.updateHUD(); }
  }

  function toMap(idx) {
    if (!curParty) return;
    if (Game.splitArmyToMap(curParty, idx, false)) {
      if (!curParty.isArmyOnly) G.selHeroId = curParty.id;
      render();
    }
  }

  function dismissStack(idx) {
    if (!curParty || !curParty.army[idx]) return;
    const s = curParty.army[idx], u = UNIT_MAP[s.id];
    if (!confirm(`Распустить отряд «${u.name} ×${s.count}»? Бойцы покинут армию навсегда.`)) return;
    curParty.army.splice(idx, 1);
    Sound.play("click");
    if (curParty.isArmyOnly && !curParty.army.length) {
      curParty.alive = false;
      G.heroes = G.heroes.filter(x => x.id !== curParty.id);
      showToast("🗑️ Безгеройный отряд полностью распущен.");
      return close();
    }
    render(); MapUI.updateHUD();
  }

  const nextLevelXp = lvl => lvl < XP_TABLE.length - 1 ? XP_TABLE[lvl + 1] : 26000 + (lvl - 9) * 6500;

  function buildArmyHtml(ent) {
    return ent.army.map((a, i) => {
      const u = UNIT_MAP[a.id], brd = u.upg ? "var(--gold)" : "#5c4629";
      const hasDup = ent.army.filter(x => x.id === a.id).length > 1;
      const canOut = !ent.isArmyOnly || ent.army.length > 1;
      return `<div class="item-row" style="flex-direction:column;align-items:stretch;gap:5px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <canvas class="u-ico" data-uid="${u.id}" width="40" height="40" style="width:40px;height:40px;border:1.5px solid ${brd};border-radius:4px;flex-shrink:0;background:#100c08;"></canvas>
          <div style="flex:1;min-width:0;"><b>${u.name} ×${a.count}</b><br>
            <small style="color:var(--text-dim)">HP:${u.hp} Атк:${u.atk} Защ:${u.def} Ур:${u.minD}-${u.maxD} Ск:${u.spd}</small>
            ${u.alt ? `<br><small style="color:var(--gold)">★ ${u.alt.name}</small>` : ""}
            ${u.spell ? `<br><small style="color:#78c2ff">🔮 ${SPELLS[u.spell]?.name}</small>` : ""}
          </div>
        </div>
        <div style="display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;">
          <button class="btn btn-sm" style="padding:2px 6px;" ${i === 0 ? "disabled" : ""} onclick="HeroUI.moveStack(${i},-1)" title="Выше (верхний фланг)">▲</button>
          <button class="btn btn-sm" style="padding:2px 6px;" ${i === ent.army.length - 1 ? "disabled" : ""} onclick="HeroUI.moveStack(${i},1)" title="Ниже (нижний фланг)">▼</button>
          <button class="btn btn-sm" style="padding:2px 6px;" ${a.count < 2 || ent.army.length >= 6 ? "disabled" : ""} onclick="HeroUI.splitStack(${i})" title="Разделить пополам">✂️</button>
          ${hasDup ? `<button class="btn btn-sm btn-gold" style="padding:2px 6px;" onclick="HeroUI.mergeStack(${i})" title="Объединить одинаковые">🔗</button>` : ""}
          <button class="btn btn-sm" style="padding:2px 6px;" ${!canOut ? "disabled" : ""} onclick="HeroUI.toMap(${i})" title="Вывести на карту как отряд без героя">🚩</button>
          <button class="btn btn-sm btn-danger" style="padding:2px 6px;" onclick="HeroUI.dismissStack(${i})" title="Распустить отряд">🗑️</button>
        </div>
      </div>`;
    }).join("");
  }

  function render() {
    if (!curParty) return;
    const box = document.getElementById("hero-content");
    if (curParty.isArmyOnly) {
      box.innerHTML = `
        <div class="modal-head"><h2>🚩 ${curParty.name} (Отряд без героя)</h2>
          <button class="btn btn-sm" onclick="HeroUI.close()">✕ Закрыть</button></div>
        <p style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">
          Автономный отряд: может ходить по карте (ОХ: ${Math.floor(curParty.move)}/${Game.getEntityMaxMove(curParty)}) и сражаться, но не может захватывать шахты, города и сокровища. Кликните им на союзного героя для передачи войск.
        </p>
        <div class="build-list" style="max-height:360px;">${buildArmyHtml(curParty)}</div>`;
      return paintUnitIcons(box);
    }

    const party = Game.getPartyHeroes(curParty), h = getActiveHero();

    box.innerHTML = `
      <div class="modal-head"><h2>🧙 ${h.name} — Уровень ${h.level}</h2>
        <button class="btn btn-sm" onclick="HeroUI.close()">✕ Закрыть</button></div>
      ${tabsHtml}
      <div class="hero-layout">

      if (hero.level >= cap || hero.xp < nextLevelXp(hero.level)) { if (onDone) onDone(); return; }

      const unlearned = SPELL_LIST.filter(s => !hero.spells.includes(s.id));

        hero.stats.atk++; hero.stats.def++; hero.stats.sp++;
        const st = getHeroStats(hero); hero.hp = st.maxHp; hero.mana = st.maxMana;

const ExchangeUI = (() => {
  let hA = null, hB = null;

  function ensureModal() {
    let m = document.getElementById("modal-exchange");
    if (!m) {
      m = document.createElement("div"); m.id = "modal-exchange"; m.className = "modal";
      m.innerHTML = `<div class="modal-box" style="max-width:960px;" id="exchange-content"></div>`;
      document.body.appendChild(m);
    }
    return m;
  }

  function open(entA, entB) {
    if (!entA || !entB || entA.id === entB.id) return;
    hA = entA; hB = entB;
    Sound.play("click"); ensureModal().classList.add("active"); render();
  }

  function close() {
    const m = document.getElementById("modal-exchange");
    if (m) m.classList.remove("active");
    hA = null; hB = null;
    if (G) MapUI.updateAll();
  }

  function switchTo(side) { const t = side === 0 ? hA : hB; close(); if (t) Game.selectHero(t.id); }

  function mergeParties(leaderSide) {
    const leader = leaderSide === 0 ? hA : hB, guest = leaderSide === 0 ? hB : hA;
    if (Game.mergeHeroInto(leader, guest)) close();
  }

  function checkEmptyArmyParty(ent, other) {
    if (ent.isArmyOnly && !ent.army.length) {
      ent.alive = false; G.heroes = G.heroes.filter(x => x.id !== ent.id);
      G.selHeroId = other.id; close();
      showToast(`✅ Войска переданы, отряд расформирован.`);
      return true;
    }
    return false;
  }

  function transferStack(fromSide, idx, half = false) {
    if (!hA || !hB) return;
    const from = fromSide === 0 ? hA : hB, to = fromSide === 0 ? hB : hA, s = from.army[idx];
    if (!s) return;
    if (!to.army.find(x => x.id === s.id) && to.army.length >= 6) return showToast(`У ${to.name} нет свободных слотов (макс. 6)!`);
    const amt = half ? Math.max(1, Math.floor(s.count / 2)) : s.count;
    addArmy(to.army, s.id, amt); s.count -= amt;
    if (s.count <= 0) from.army.splice(idx, 1);
    Sound.play("click");
    if (!checkEmptyArmyParty(from, to)) { render(); MapUI.updateHUD(); }
  }

  function transferAllArmy(fromSide) {
    if (!hA || !hB) return;
    const from = fromSide === 0 ? hA : hB, to = fromSide === 0 ? hB : hA, rest = [];
    let moved = 0;
    from.army.forEach(s => { if (to.army.find(x => x.id === s.id) || to.army.length < 6) { addArmy(to.army, s.id, s.count); moved++; } else rest.push(s); });
    from.army = rest;
    if (moved > 0) Sound.play("click"); else showToast("У получателя заняты все 6 слотов!");
    if (!checkEmptyArmyParty(from, to)) { render(); MapUI.updateHUD(); }
  }

  function transferArt(fromSide, src, keyOrIdx) {
    if (!hA || !hB || hA.isArmyOnly || hB.isArmyOnly) return;
    const from = fromSide === 0 ? hA : hB, to = fromSide === 0 ? hB : hA;
    const artId = src === "equip" ? from.equip[keyOrIdx] : from.bag[keyOrIdx];
    const art = ART_MAP[artId];
    if (!art) return;
    if (src === "equip") from.equip[keyOrIdx] = null; else from.bag.splice(keyOrIdx, 1);
    const stF = getHeroStats(from);
    from.hp = Math.min(from.hp, stF.maxHp); from.mana = Math.min(from.mana, stF.maxMana);
    const freeSlot = EQUIP_SLOTS.find(s => s.accept === art.slot && !to.equip[s.key]);
    if (freeSlot) { to.equip[freeSlot.key] = artId; to.hp = Math.min(getHeroStats(to).maxHp, to.hp + (art.bonus.hp || 0)); }
    else to.bag.push(artId);
    Sound.play("click"); render(); MapUI.updateHUD();
  }

  function renderCol(ent, side) {
    const arrow = side === 0 ? "➔" : "⬅", other = side === 0 ? hB : hA;
    const armyHtml = ent.army.length ? ent.army.map((a, i) => {
      const u = UNIT_MAP[a.id], brd = u.upg ? "var(--gold)" : "#5c4629";
      const btns = side === 0
        ? `${a.count >= 2 ? `<button class="btn btn-sm" style="padding:2px 6px;" onclick="ExchangeUI.transferStack(0,${i},true)">½ ${arrow}</button>` : ""}
           <button class="btn btn-sm btn-gold" style="padding:2px 8px;" onclick="ExchangeUI.transferStack(0,${i},false)">${arrow}</button>`
        : `<button class="btn btn-sm btn-gold" style="padding:2px 8px;" onclick="ExchangeUI.transferStack(1,${i},false)">${arrow}</button>
           ${a.count >= 2 ? `<button class="btn btn-sm" style="padding:2px 6px;" onclick="ExchangeUI.transferStack(1,${i},true)">${arrow} ½</button>` : ""}`;
      return `<div class="item-row">
        <div style="display:flex;align-items:center;gap:7px;">
          <canvas class="u-ico" data-uid="${u.id}" width="36" height="36" style="width:36px;height:36px;border:1.5px solid ${brd};border-radius:4px;background:#100c08;"></canvas>
          <div><b>${u.name}</b> <span style="color:var(--gold)">×${a.count}</span></div>
        </div><div style="display:flex;gap:4px;">${btns}</div></div>`;
    }).join("") : `<div style="font-size:12px;color:var(--text-dim);padding:6px;">Армия пуста</div>`;

    let artBlock = "";
    if (!ent.isArmyOnly && !other.isArmyOnly) {
      const allArts = [
        ...EQUIP_SLOTS.filter(s => ent.equip[s.key]).map(s => ({ src: "equip", key: s.key, tag: s.label, id: ent.equip[s.key] })),
        ...ent.bag.map((id, i) => ({ src: "bag", key: i, tag: "Рюкзак", id }))
      ];
      artBlock = `<div style="font-size:12px;color:var(--gold);font-weight:bold;margin:8px 0 4px;">Артефакты</div>
        <div class="build-list" style="max-height:150px;">${allArts.length ? allArts.map(it => {
          const a = ART_MAP[it.id], arg = it.src === "equip" ? `'${it.key}'` : it.key;
          return `<div class="item-row"><div>${a.icon} <b>${a.name}</b> <small style="color:var(--gold)">[${it.tag}]</small></div>
            <button class="btn btn-sm" style="padding:2px 8px;" onclick="ExchangeUI.transferArt(${side},'${it.src}',${arg})">${arrow}</button></div>`;
        }).join("") : `<div style="font-size:12px;color:var(--text-dim);">Нет артефактов</div>`}</div>`;
    }
    const party = Game.getPartyHeroes(ent);
    const headSub = ent.isArmyOnly ? `<div style="color:#9af58e;">Отряд без героя</div>`
      : `<div>HP:${ent.hp}/${getHeroStats(ent).maxHp} | Мана:${ent.mana}/${getHeroStats(ent).maxMana}</div>${party.length > 1 ? `<div style="color:#ffd97d;">👑 Героев: ${party.length}</div>` : ""}`;
    return `<div class="panel-box">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <canvas id="ex-port-${side}" class="${ent.isArmyOnly && ent.army[0] ? "u-ico" : ""}" data-uid="${ent.isArmyOnly && ent.army[0] ? ent.army[0].id : ""}" width="52" height="52" style="border:2px solid var(--gold);border-radius:4px;background:#100c08;"></canvas>
          <div style="font-size:12px;"><div style="color:var(--gold);font-weight:bold;">${ent.name}${ent.isArmyOnly ? "" : ` (Ур.${ent.level})`}</div>${headSub}</div>
        </div>
        <button class="btn btn-sm" onclick="ExchangeUI.switchTo(${side})">🎯 Выбрать</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px;">
        <span style="font-size:12px;color:var(--gold);font-weight:bold;">Войска (${ent.army.length}/6)</span>
        <button class="btn btn-sm" ${!ent.army.length ? "disabled" : ""} onclick="ExchangeUI.transferAllArmy(${side})">${side === 0 ? "Все ➔" : "⬅ Все"}</button>
      </div>
      <div class="build-list" style="max-height:200px;">${armyHtml}</div>
      ${artBlock}
    </div>`;
  }

  function render() {
    if (!hA || !hB) return;
    const bothHeroes = !hA.isArmyOnly && !hB.isArmyOnly;
    const mergeBar = bothHeroes ? `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;padding:8px;background:#16100b;border:1px solid var(--gold-dim);border-radius:4px;">
      <button class="btn btn-gold" onclick="ExchangeUI.mergeParties(0)">👑 Объединить в отряд «${hA.name}»</button>
      <button class="btn btn-gold" onclick="ExchangeUI.mergeParties(1)">👑 Объединить в отряд «${hB.name}»</button>
    </div>` : "";
    const box = document.getElementById("exchange-content");
    box.innerHTML = `<div class="modal-head"><h2>🤝 Обмен и объединение отрядов</h2>
        <button class="btn btn-sm" onclick="ExchangeUI.close()">✕ Закрыть</button></div>
      ${mergeBar}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${renderCol(hA, 0)}${renderCol(hB, 1)}</div>`;
    if (!hA.isArmyOnly) GFX.drawHeroPortrait(document.getElementById("ex-port-0"), hA);
    if (!hB.isArmyOnly) GFX.drawHeroPortrait(document.getElementById("ex-port-1"), hB);
    paintUnitIcons(box);
  }

  return { open, close, switchTo, mergeParties, transferStack, transferAllArmy, transferArt };
})();

// ==================== БЛОК 9А: ДВИЖОК БОЕВЫХ АНИМАЦИЙ (BattleVFX) ====================
const BattleVFX = (() => {
  let anims = [], floats = [], parts = [], poses = new Map(), speed = 1;

  const lerp = (a, b, t) => a + (b - a) * t;
  const poseOf = id => {
    let p = poses.get(id);
    if (!p) { p = { dx: 0, dy: 0, swing: 0, hurt: 0, walk: 0 }; poses.set(id, p); }
    return p;
  };

  function clear() { anims = []; floats = []; parts = []; poses.clear(); }
  function isBusy() { return anims.length > 0; }
  function hasVisuals() { return anims.length > 0 || floats.length > 0 || parts.length > 0; }

  function addFloat(text, px, py, color = "#ffe066") {
    floats.push({ text, x: px, y: py, color, t: 34, max: 34 });
  }

  function flashHurt(unitId, frames = 12) {
    if (!unitId) return;
    poseOf(unitId).hurt = Math.max(poseOf(unitId).hurt, frames);
  }

  function spawnSparks(x, y, color, count = 12, speed = 3.2) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2, spd = (0.4 + Math.random() * 0.9) * speed;
      parts.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 0.8, r: 2 + Math.random() * 2.5, color, t: 16 + Math.floor(Math.random() * 12), max: 28 });
    }
  }

  function makeBolt(x1, y1, x2, y2, segs = 9, jit = 22) {
    const pts = [{ x: x1, y: y1 }];
    for (let i = 1; i < segs; i++) {
      const t = i / segs;
      pts.push({ x: lerp(x1, x2, t) + (Math.random() - 0.5) * jit, y: lerp(y1, y2, t) + (Math.random() - 0.5) * jit });
    }
    pts.push({ x: x2, y: y2 });
    return pts;
  }

  // Запуск боевой анимации; onImpact срабатывает в момент попадания, onDone — по завершении
  function play(type, opts, onImpact = null, onDone = null) {
    const durMap = { move: 18, melee: 22, arrow: 18, axe: 20, boulder: 22, bolt: 18, fireball: 30, icebolt: 20, lightning: 22, meteor: 34, aura: 24 };
    const impMap = { move: 1, melee: 0.5, arrow: 0.82, axe: 0.82, boulder: 0.82, bolt: 0.8, fireball: 0.52, icebolt: 0.78, lightning: 0.32, meteor: 0.62, aura: 0.45 };
    const a = {
      type, opts, onImpact, onDone, f: 0,
      dur: opts.dur || durMap[type] || 20,
      impactAt: opts.impactAt ?? impMap[type] ?? 0.6,
      impacted: false, seed: Math.random() * 100
    };
    if (type === "meteor") {
      a.rocks = Array.from({ length: 5 }, (_, i) => ({
        tx: opts.x2 + (Math.random() - 0.5) * 110,
        ty: opts.y2 + (Math.random() - 0.5) * 75,
        delay: i * 0.08
      }));
    }
    anims.push(a);
  }

function updateAnim(a, callbacks) {
    const p = Math.min(1, a.f / a.dur), o = a.opts;
    if (a.type === "move" && o.unitId) {
      const ps = poseOf(o.unitId);
      ps.dx = lerp(o.x1 - o.x2, 0, p);
      ps.dy = lerp(o.y1 - o.y2, 0, p) - Math.sin(p * Math.PI) * 7;
      ps.walk = 1;
    } else if (a.type === "melee" && o.unitId) {
      const ps = poseOf(o.unitId);
      const lunge = Math.sin(p * Math.PI);
      ps.dx = (o.x2 - o.x1) * 0.42 * lunge;
      ps.dy = (o.y2 - o.y1) * 0.42 * lunge;
      ps.swing = p < 0.35 ? -0.55 * (p / 0.35) : p < 0.68 ? lerp(-0.55, 1.35, (p - 0.35) / 0.33) : lerp(1.35, 0, (p - 0.68) / 0.32);
    }

    if (!a.impacted && p >= a.impactAt) {
      a.impacted = true;
      if (a.type === "melee") spawnSparks(o.x2, o.y2, o.style === "club" ? "#d9a25f" : o.style === "holy" ? "#fff08a" : "#ffe6b3", 12, 3.6);
      else if (a.type === "arrow" || a.type === "axe") spawnSparks(o.x2, o.y2, "#e8f5ff", 9, 2.8);
      else if (a.type === "boulder") spawnSparks(o.x2, o.y2, "#b59d84", 16, 4.2);
      else if (a.type === "fireball" || a.type === "meteor") spawnSparks(o.x2, o.y2, "#ff9124", 22, 4.8);
      else if (a.type === "icebolt") spawnSparks(o.x2, o.y2, "#8cf4ff", 16, 3.8);
      else if (a.type === "lightning") spawnSparks(o.x2, o.y2, "#9ef6ff", 16, 4.4);
      else if (a.type === "bolt") spawnSparks(o.x2, o.y2, o.color || "#ffe066", 12, 3.2);
      if (a.onImpact) callbacks.push(a.onImpact);
    }
    a.f += speed;
    if (a.f > a.dur) {
      if ((a.type === "move" || a.type === "melee") && o.unitId) {
        const ps = poseOf(o.unitId); ps.dx = 0; ps.dy = 0; ps.swing = 0; ps.walk = 0;
      }
      if (a.onDone) callbacks.push(a.onDone);
      return false;
    }
    return true;
  }

    function drawSwordSlash(ctx, x, y, p, dir = 1) {
    const e = 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 2.2);
    const a0 = -2.05, a1 = 1.25, ang = a0 + (a1 - a0) * e;
    const trailStart = Math.max(a0, ang - 1.25);
    const alpha = p < 0.78 ? 1 : Math.max(0, (1 - p) / 0.22);

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir, 1);
    ctx.translate(-16, 4);
    ctx.globalAlpha = alpha;

    // Полупрозрачный шлейф размаха за клинком
    if (ang > trailStart + 0.05) {
      const tr = ctx.createRadialGradient(0, 0, 14, 0, 0, 48);
      tr.addColorStop(0, "rgba(255,245,200,0)");
      tr.addColorStop(0.65, "rgba(220,240,255,0.28)");
      tr.addColorStop(1, "rgba(255,235,140,0.58)");
      ctx.fillStyle = tr;
      ctx.beginPath();
      ctx.arc(0, 0, 47, trailStart, ang);
      ctx.arc(0, 0, 20, ang, trailStart, true);
      ctx.closePath();
      ctx.fill();
    }

    // Сам меч, описывающий полукруг по цели
    ctx.save();
    ctx.rotate(ang);
    // Верхняя светлая грань лезвия
    const b1 = ctx.createLinearGradient(16, -4, 52, 0);
    b1.addColorStop(0, "#dce8f5"); b1.addColorStop(1, "#ffffff");
    ctx.fillStyle = b1;
    ctx.beginPath();
    ctx.moveTo(16, -3.2); ctx.lineTo(44, -2.5); ctx.lineTo(52, 0); ctx.lineTo(16, 0);
    ctx.closePath(); ctx.fill();
    // Нижняя теневая грань лезвия
    const b2 = ctx.createLinearGradient(16, 0, 52, 4);
    b2.addColorStop(0, "#5c6e85"); b2.addColorStop(1, "#b8cbe0");
    ctx.fillStyle = b2;
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(52, 0); ctx.lineTo(44, 2.5); ctx.lineTo(16, 3.2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(16, -3.2); ctx.lineTo(44, -2.5); ctx.lineTo(52, 0); ctx.lineTo(44, 2.5); ctx.lineTo(16, 3.2);
    ctx.closePath(); ctx.stroke();
    // Гарда, рукоять и навершие
    ctx.fillStyle = "#f2c94c"; ctx.strokeStyle = "#6e470c"; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(13, -7.5, 3.8, 15, 1.5) : ctx.rect(13, -7.5, 3.8, 15);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#5c3416"; ctx.fillRect(4.5, -2.1, 8.8, 4.2);
    ctx.fillStyle = "#f2c94c"; ctx.beginPath(); ctx.arc(3.5, 0, 2.8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // Искры в момент попадания по врагу
    if (p > 0.3 && p < 0.85) {
      const sp = (p - 0.3) / 0.55;
      ctx.strokeStyle = `rgba(255,235,130,${1 - sp})`; ctx.lineWidth = 1.6;
      for (let i = 0; i < 6; i++) {
        const sa = -1.1 + i * 0.44, r1 = 8 + sp * 16, r2 = r1 + 7 * (1 - sp);
        ctx.beginPath();
        ctx.moveTo(16 + Math.cos(sa) * r1, -4 + Math.sin(sa) * r1);
        ctx.lineTo(16 + Math.cos(sa) * r2, -4 + Math.sin(sa) * r2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawAnim(ctx, a) {
    const p = Math.min(1, a.f / a.dur), o = a.opts;
    ctx.save();

    if (a.type === "melee" && p > 0.32 && p < 0.85) {
      const t = (p - 0.32) / 0.53, al = 1 - t;
      if (o.whirlwind) {
        ctx.strokeStyle = `rgba(165,245,145,${al})`; ctx.lineWidth = 6 * (1 - t * 0.5);
        ctx.beginPath(); ctx.arc(o.x1, o.y1, 24 + t * 58, t * 4, t * 4 + Math.PI * 1.4); ctx.stroke();
      } else if (o.style === "club") {
        ctx.strokeStyle = `rgba(235,175,90,${al})`; ctx.lineWidth = 5 * (1 - t * 0.4);
        ctx.beginPath(); ctx.ellipse(o.x2, o.y2 + 12, 12 + t * 46, 6 + t * 18, 0, 0, Math.PI * 2); ctx.stroke();
      } else {
        drawSwordSlash(ctx, o.x2, o.y2, t, o.x2 >= o.x1 ? 1 : -1);
      }
    } else if (a.type === "arrow" || a.type === "axe" || a.type === "boulder" || a.type === "bolt") {
      const fp = Math.min(1, p / a.impactAt);
      const arcH = a.type === "boulder" ? 58 : a.type === "arrow" ? 28 : a.type === "axe" ? 36 : 8;
      const x = lerp(o.x1, o.x2, fp), y = lerp(o.y1, o.y2, fp) - Math.sin(fp * Math.PI) * arcH;
      const dx = o.x2 - o.x1, dy = (o.y2 - o.y1) - Math.cos(fp * Math.PI) * arcH * Math.PI;
      const ang = Math.atan2(dy, dx);

      if (a.type === "arrow") {
        const px = lerp(o.x1, o.x2, Math.max(0, fp - 0.14)), py = lerp(o.y1, o.y2, Math.max(0, fp - 0.14)) - Math.sin(Math.max(0, fp - 0.14) * Math.PI) * arcH;
        ctx.strokeStyle = o.color || "rgba(255,245,200,0.5)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        ctx.translate(x, y); ctx.rotate(ang);
        ctx.strokeStyle = o.color || "#d9a25f"; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(12, 0); ctx.stroke();
        ctx.fillStyle = "#eef6ff"; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = o.color || "#9af58e"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-18, -4); ctx.moveTo(-12, 0); ctx.lineTo(-18, 4); ctx.stroke();
      } else if (a.type === "axe") {
        ctx.translate(x, y); ctx.rotate(fp * Math.PI * 6 * (dx >= 0 ? 1 : -1));
        ctx.strokeStyle = "#6e4219"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();

      } else if (a.type === "boulder") {
        ctx.translate(x, y); ctx.rotate(fp * Math.PI * 3);
        ctx.fillStyle = "#7a736b"; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#3d3832"; ctx.lineWidth = 2; ctx.stroke();

          ctx.beginPath(); ctx.arc(o.x2, o.y2, 18 + ep * 75, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        const col = o.color || "#ffe066";
        const grd = ctx.createRadialGradient(x, y, 2, x, y, 14);
        grd.addColorStop(0, "#ffffff"); grd.addColorStop(0.45, col); grd.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
      }
    } else if (a.type === "fireball") {
      if (p < a.impactAt) {
        const fp = p / a.impactAt;
        const x = lerp(o.x1, o.x2, fp), y = lerp(o.y1, o.y2, fp) - Math.sin(fp * Math.PI) * 18;
        if (a.f % 2 === 0) spawnSparks(x, y, "#ff881a", 2, 1.4);
        const grd = ctx.createRadialGradient(x, y, 3, x, y, 22);
        grd.addColorStop(0, "#fff8b8"); grd.addColorStop(0.45, "#ff7714"); grd.addColorStop(1, "rgba(180,20,0,0)");
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.fill();
      } else {
        const ep = (p - a.impactAt) / (1 - a.impactAt), maxR = o.aoe ? 108 : 54, rad = 16 + ep * maxR;
        const grd = ctx.createRadialGradient(o.x2, o.y2, 4, o.x2, o.y2, rad);
        grd.addColorStop(0, `rgba(255,250,190,${1 - ep})`);
        grd.addColorStop(0.48, `rgba(255,105,20,${(1 - ep) * 0.9})`);
        grd.addColorStop(1, "rgba(160,15,0,0)");
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(o.x2, o.y2, rad, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(255,200,80,${(1 - ep) * 0.8})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(o.x2, o.y2, rad * 0.85, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (a.type === "icebolt") {
      if (p < a.impactAt) {
        const fp = p / a.impactAt, x = lerp(o.x1, o.x2, fp), y = lerp(o.y1, o.y2, fp);
        ctx.translate(x, y); ctx.rotate(Math.atan2(o.y2 - o.y1, o.x2 - o.x1));
        ctx.fillStyle = "#b8fbff"; ctx.strokeStyle = "#2eb8ff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -6); ctx.lineTo(-16, 0); ctx.lineTo(-10, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else {
        const ep = (p - a.impactAt) / (1 - a.impactAt);
        ctx.strokeStyle = `rgba(140,245,255,${1 - ep})`; ctx.lineWidth = 3;
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(o.x2, o.y2); ctx.lineTo(o.x2 + Math.cos(ang) * (15 + ep * 36), o.y2 + Math.sin(ang) * (15 + ep * 36)); ctx.stroke();
        }
      }
    } else if (a.type === "lightning") {
      const al = p < 0.25 ? p / 0.25 : 1 - (p - 0.25) / 0.75;
      const sx = o.fromSky ? o.x2 + 24 : o.x1, sy = o.fromSky ? 0 : o.y1;
      const pts = makeBolt(sx, sy, o.x2, o.y2, 9, 26);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = `rgba(80,210,255,${al * 0.55})`; ctx.lineWidth = 10;
      ctx.beginPath(); pts.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)); ctx.stroke();
      ctx.strokeStyle = `rgba(235,252,255,${al})`; ctx.lineWidth = 3;
      ctx.stroke();
      const mid = pts[4], br = makeBolt(mid.x, mid.y, mid.x + (Math.random() - 0.5) * 60, mid.y + 38, 4, 14);
      ctx.lineWidth = 1.8; ctx.beginPath(); br.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)); ctx.stroke();
      ctx.fillStyle = `rgba(180,245,255,${al * 0.45})`; ctx.beginPath(); ctx.arc(o.x2, o.y2, 26, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === "meteor" && a.rocks) {
      a.rocks.forEach(rk => {
        const rp = (p - rk.delay) / 0.55;
        if (rp < 0 || rp > 1.35) return;
        if (rp <= 1) {
          const x = lerp(rk.tx - 150, rk.tx, rp), y = lerp(-40, rk.ty, rp);
          ctx.strokeStyle = "rgba(255,140,30,0.65)"; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(x - 32, y - 48); ctx.lineTo(x, y); ctx.stroke();
          ctx.fillStyle = "#ffcf66"; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
        } else {
          const ep = (rp - 1) / 0.35, rad = 14 + ep * 48;
          ctx.strokeStyle = `rgba(255,115,30,${1 - ep})`; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(rk.tx, rk.ty, rad, 0, Math.PI * 2); ctx.stroke();
        }
      });
    } else if (a.type === "aura") {
      const col = o.color || "#59eb7e", dir = o.debuff ? 1 : -1;
      for (let i = 0; i < 3; i++) {
        const rp = (p + i * 0.22) % 1;
        ctx.strokeStyle = col; ctx.globalAlpha = (1 - rp) * 0.85; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(o.x2, o.y2 + 16 + dir * rp * 38, 18 + rp * 16, 7 + rp * 5, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();
  }

function tickAndDraw(ctx) {
    poses.forEach(ps => { if (ps.hurt > 0) ps.hurt = Math.max(0, ps.hurt - speed); });
    const current = anims, next = [], callbacks = [];
    for (const a of current) {
      drawAnim(ctx, a);
      if (updateAnim(a, callbacks)) next.push(a);
    }
    anims = next;
    for (const cb of callbacks) cb();
    parts = parts.filter(pt => {
      pt.x += pt.vx * speed; pt.y += pt.vy * speed; pt.vy += 0.14 * speed; pt.t -= speed;
      ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.t / pt.max);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      return pt.t > 0;
    });
    floats = floats.filter(f => {
      f.t -= speed;
      ctx.fillStyle = f.color; ctx.globalAlpha = Math.min(1, f.t / 12);
      ctx.font = "bold 16px Georgia"; ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y - (f.max - f.t) * 0.8);
      ctx.globalAlpha = 1;
      return f.t > 0;
    });
  }

  return {
    clear, isBusy, hasVisuals, addFloat, flashHurt, play, tickAndDraw,
    setSpeed: s => { speed = s; }, getSpeed: () => speed,
    getPose: id => poses.get(id) || { dx: 0, dy: 0, swing: 0, hurt: 0, walk: 0 }
  };
})();
// ==================== БЛОК 9Б: ТАКТИЧЕСКИЙ БОЙ С АНИМАЦИЯМИ И ИИ ====================
const Battle = (() => {

  const cx = gx => gx * CW + CW / 2;
  const cy = gy => gy * CH + CH / 2;
  const dist = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
  const effSpd = u => u.buffs.root > 0 ? 0 : Math.max(1, u.spd + (u.buffs.haste > 0 ? 3 : 0) - (u.buffs.slow > 0 ? 2 : 0));
  const isAdjacentEnemy = u => B.units.some(e => e.alive && e.side !== u.side && dist(u, e) <= 1);
  const canShoot = u => !isAdjacentEnemy(u) && (u.isHero || u.type === "ranged");
