<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heroes of the CIT — Герои ЦИТ IV</title>
<style>
:root {
  --bg-dark: #120e0a;
  --bg-panel: #1f1812;
  --bg-panel-2: #2b2118;
  --gold: #e0b84c;
  --gold-dim: #8a6c27;
  --text: #f3e8d2;
  --text-dim: #b4a284;
  --danger: #c93b3b;
  --success: #45a35d;
  --mana: #4b8fe2;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-dark); color: var(--text);
  font-family: "Georgia", "Times New Roman", serif;
}
button, select, input { font-family: inherit; color: var(--text); }
.btn {
  background: linear-gradient(180deg, #4b3826, #2b1f14);
  border: 2px solid var(--gold-dim); color: var(--text);
  padding: 8px 16px; border-radius: 4px; cursor: pointer;
  font-weight: bold; font-size: 14px; transition: 0.15s;
  box-shadow: inset 0 1px 0 rgba(255,220,140,0.25), 0 2px 6px rgba(0,0,0,0.6);
}
.btn:hover:not(:disabled) {
  border-color: var(--gold); background: linear-gradient(180deg, #634930, #3a291a);
  transform: translateY(-1px);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-gold {
  background: linear-gradient(180deg, #b88b28, #6e4e10);
  border-color: #ffd97d; color: #fff8e1;
}
.btn-gold:hover:not(:disabled) { background: linear-gradient(180deg, #d4a437, #8a6419); }
.btn-danger {
  background: linear-gradient(180deg, #8f2424, #4f1212);
  border-color: #d95c5c;
}
.btn-sm { padding: 4px 10px; font-size: 12px; }
.screen { display: none; width: 100%; height: 100%; position: absolute; inset: 0; }
.screen.active { display: flex; flex-direction: column; }

/* Главное меню и экраны выбора */
.menu-bg {
  background: radial-gradient(circle at 50% 35%, #3a2415 0%, #160f0a 65%, #090604 100%);
  align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
}
.title-box { text-align: center; margin-bottom: 24px; }
.title-box h1 {
  font-size: 52px; color: var(--gold); letter-spacing: 2px;
  text-shadow: 0 4px 16px #000, 0 0 24px rgba(224,184,76,0.45);
}
.title-box p { color: var(--text-dim); font-size: 16px; margin-top: 6px; font-style: italic; }
.menu-card {
  background: linear-gradient(180deg, rgba(38,29,21,0.96), rgba(22,16,11,0.98));
  border: 2px solid var(--gold-dim); border-radius: 8px; padding: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.85); max-width: 1120px; width: 100%;
}
.menu-buttons { display: flex; flex-direction: column; gap: 12px; width: 320px; margin: 0 auto; }
.menu-buttons .btn { padding: 12px 20px; font-size: 16px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 16px 0; }
.camp-card {
  background: var(--bg-panel-2); border: 2px solid var(--gold-dim);
  border-radius: 6px; padding: 12px; cursor: pointer; transition: 0.15s;
  display: flex; flex-direction: column; gap: 6px;
}
.camp-card:hover { border-color: var(--gold); background: #36291d; }
.camp-card.selected { border-color: #ffe27a; box-shadow: 0 0 14px rgba(255,215,90,0.4); }
.camp-card.locked { opacity: 0.55; filter: grayscale(0.7); }
.camp-card h3 { color: var(--gold); font-size: 16px; }
.camp-card .bio { font-size: 12px; color: var(--text-dim); line-height: 1.35; }
.mission-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.mission-btn { flex: 1 1 170px; text-align: left; padding: 8px 10px; font-size: 12px; }
.form-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
.form-row label { min-width: 150px; color: var(--gold); font-weight: bold; }
.form-row select, .form-row input {
  background: #140f0b; border: 1px solid var(--gold-dim); padding: 6px 10px; border-radius: 4px;
}

/* Верхняя панель и игровой интерфейс */
#top-bar {
  height: 44px; background: linear-gradient(180deg, #2b2016, #18120c);
  border-bottom: 2px solid var(--gold-dim); display: flex; align-items: center;
  justify-content: space-between; padding: 0 12px; gap: 10px; flex-shrink: 0;
}
.res-group { display: flex; align-items: center; gap: 14px; font-size: 13px; }
.res-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.res-inc { color: #7cd68b; font-size: 11px; }
.top-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.top-actions { display: flex; align-items: center; gap: 6px; }
#game-main { display: flex; flex: 1; min-height: 0; position: relative; }
#map-wrap { flex: 1; position: relative; overflow: hidden; background: #0b0907; }
#map-canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
#objective-banner {
  position: absolute; top: 8px; left: 8px; max-width: 520px;
  background: rgba(20,15,10,0.86); border: 1px solid var(--gold-dim);
  padding: 6px 10px; border-radius: 4px; font-size: 12px; pointer-events: none;
}

/* Правая панель */
#side-panel {
  width: 280px; background: var(--bg-panel); border-left: 2px solid var(--gold-dim);
  display: flex; flex-direction: column; padding: 8px; gap: 8px; overflow-y: auto; flex-shrink: 0;
}
#minimap-box {
  border: 2px solid var(--gold-dim); background: #000; width: 260px; height: 156px;
  align-self: center; position: relative; cursor: pointer;
}
#minimap-canvas { width: 100%; height: 100%; display: block; }
.panel-box {
  background: var(--bg-panel-2); border: 1px solid var(--gold-dim);
  border-radius: 4px; padding: 8px;
}
.hero-header { display: flex; gap: 8px; align-items: center; }
#side-hero-portrait {
  width: 54px; height: 54px; border: 2px solid var(--gold); border-radius: 4px; background: #140f0b;
}
.hero-bars { flex: 1; font-size: 12px; }
.bar-bg { height: 7px; background: #0e0a07; border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
.bar-fill { height: 100%; transition: width 0.2s; }
.army-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; }
.army-slot {
  background: #16100b; border: 1px solid #594426; border-radius: 4px;
  padding: 4px; text-align: center; font-size: 11px; min-height: 54px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.army-slot.empty { opacity: 0.4; justify-content: center; }
.army-slot .cnt { color: var(--gold); font-weight: bold; font-size: 12px; }
.list-scroll { max-height: 92px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.mini-row {
  display: flex; justify-content: space-between; align-items: center;
  background: #17110c; padding: 4px 6px; border-radius: 3px; font-size: 12px; cursor: pointer;
  border: 1px solid transparent;
}
.mini-row:hover, .mini-row.active { border-color: var(--gold); background: #2d2116; }

/* Модальные окна */
.modal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(5,4,3,0.82); align-items: center; justify-content: center; padding: 14px;
}
.modal.active { display: flex; }
.modal-box {
  background: linear-gradient(180deg, #271e16, #16100b);
  border: 2px solid var(--gold); border-radius: 8px; padding: 16px;
  max-width: 1120px; width: 100%; max-height: 94vh; overflow-y: auto;
  box-shadow: 0 12px 44px rgba(0,0,0,0.9);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--gold-dim); padding-bottom: 8px; margin-bottom: 12px;
}
.modal-head h2 { color: var(--gold); font-size: 22px; }

/* Город и Герой */
.town-layout { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
#town-canvas {
  width: 100%; height: 240px; border: 2px solid var(--gold-dim);
  border-radius: 4px; background: #100c08; display: block;
}
.build-list, .recruit-list { display: flex; flex-direction: column; gap: 6px; max-height: 290px; overflow-y: auto; }
.item-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: #1a130d; border: 1px solid #4e3b22; padding: 6px 8px; border-radius: 4px; font-size: 12px;
}
.hero-layout { display: grid; grid-template-columns: 280px 1fr 270px; gap: 12px; }
.equip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.equip-slot {
  background: #140f0a; border: 1px solid var(--gold-dim); padding: 6px;
  border-radius: 4px; font-size: 11px; min-height: 52px; cursor: pointer;
}
.equip-slot b { color: var(--gold); display: block; margin-bottom: 2px; }

/* Тактический бой */
#battle-box { max-width: 1180px; }
#battle-queue {
  display: flex; gap: 6px; overflow-x: auto; padding: 6px; margin-bottom: 8px;
  background: #120d09; border: 1px solid var(--gold-dim); border-radius: 4px;
}
.q-item {
  min-width: 96px; padding: 4px 6px; border-radius: 4px; font-size: 11px;
  background: #241b13; border: 1px solid #594426; text-align: center;
}
.q-item.ally { border-color: #5ea86b; }
.q-item.enemy { border-color: #c94b4b; }
.q-item.curr { box-shadow: 0 0 10px var(--gold); border-color: var(--gold); background: #3b2c1d; }
#battle-canvas {
  width: 100%; height: 420px; border: 2px solid var(--gold-dim);
  border-radius: 4px; display: block; background: #14100b; cursor: pointer;
}
.battle-controls {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 8px; flex-wrap: wrap;
}
#battle-log {
  margin-top: 8px; height: 74px; overflow-y: auto; background: #0f0b08;
  border: 1px solid #4a3720; padding: 6px 8px; font-size: 12px; line-height: 1.4;
}

/* Кат-сцены, звук и тост */
#cutscene-canvas {
  width: 100%; height: 320px; border: 2px solid var(--gold);
  border-radius: 4px; display: block; background: #0d0907; margin-bottom: 12px;
}
.cutscene-text {
  background: #140f0b; border: 1px solid var(--gold-dim); padding: 12px;
  border-radius: 4px; font-size: 15px; line-height: 1.5; margin-bottom: 12px;
}
#audio-floating {
  position: fixed; bottom: 10px; left: 10px; z-index: 90;
  display: flex; align-items: center; gap: 6px;
  background: rgba(24,18,12,0.92); border: 1px solid var(--gold-dim);
  padding: 4px 8px; border-radius: 20px; font-size: 12px;
}
#audio-vol { width: 72px; accent-color: var(--gold); cursor: pointer; }
#toast {
  position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
  z-index: 95; background: rgba(28,20,13,0.96); border: 2px solid var(--gold);
  padding: 8px 18px; border-radius: 6px; font-size: 14px; display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div id="audio-floating">
  <button id="audio-toggle" class="btn btn-sm">🔊 Звук</button>
  <input id="audio-vol" type="range" min="0" max="1" step="0.05" value="0.45">
</div>
<div id="toast"></div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="screen-menu" class="screen menu-bg active">
  <div class="title-box">
    <h1>⚔️ HEROES OF THE CIT IV ⚔️</h1>
    <p>Хроники борьбы с Личом Бородиным, лишением премии и принудительным голосованием в «Макс»</p>
  </div>
  <div class="menu-card" style="max-width:440px;">
    <div class="menu-buttons">
      <button class="btn btn-gold" onclick="UI.openCampaigns()">📜 Режим Кампании (20 карт + Финал)</button>
      <button class="btn" onclick="UI.openScenario()">🗺️ Режим Сценариев</button>
      <button class="btn" onclick="UI.openHotSeat()">👥 Режим Hot-Seat (2–4 игрока)</button>
      <button class="btn" id="btn-continue" onclick="SaveSys.loadGame()">💾 Продолжить игру</button>
      <button class="btn btn-sm" onclick="UI.showLoreModal()">📖 Биографии героев и боссов</button>
    </div>
  </div>
</div>

<!-- ВЫБОР КАМПАНИИ -->
<div id="screen-campaign" class="screen menu-bg">
  <div class="menu-card">
    <div class="modal-head">
      <h2>📜 Выбор кампании</h2>
      <button class="btn btn-sm" onclick="UI.showScreen('screen-menu')">← В меню</button>
    </div>
    <div id="campaign-cards" class="grid-cards"></div>
    <div id="campaign-missions" class="panel-box" style="margin-top:10px;"></div>
  </div>
</div>

<!-- НАСТРОЙКА СЦЕНАРИЯ -->
<div id="screen-scenario" class="screen menu-bg">
  <div class="menu-card" style="max-width:640px;">
    <div class="modal-head">
      <h2>🗺️ Новый сценарий</h2>
      <button class="btn btn-sm" onclick="UI.showScreen('screen-menu')">← В меню</button>
    </div>
    <div class="form-row"><label>Ваша фракция:</label><select id="scen-faction"></select></div>
    <div class="form-row"><label>Размер карты:</label>
      <select id="scen-size">
        <option value="20">Маленькая (20×14)</option>
        <option value="28" selected>Средняя (28×18)</option>
        <option value="34">Большая (34×22)</option>
      </select>
    </div>
    <div class="form-row"><label>Количество врагов:</label>
      <select id="scen-enemies">
        <option value="1">1 противник (ИИ)</option>
        <option value="2" selected>2 противника (ИИ)</option>
      </select>
    </div>
    <div class="form-row"><label>Сложность ИИ:</label>
      <select id="scen-diff">
        <option value="easy">Лёгкий</option>
        <option value="medium" selected>Средний</option>
        <option value="hard">Сложный</option>
      </select>
    </div>
    <div style="margin-top:18px;text-align:right;">
      <button class="btn btn-gold" onclick="Game.startScenario()">⚔️ Начать сценарий</button>
    </div>
  </div>
</div>

<!-- НАСТРОЙКА HOT-SEAT -->
<div id="screen-hotseat" class="screen menu-bg">
  <div class="menu-card" style="max-width:780px;">
    <div class="modal-head">
      <h2>👥 Hot-Seat (игра за одним экраном)</h2>
      <button class="btn btn-sm" onclick="UI.showScreen('screen-menu')">← В меню</button>
    </div>
    <div class="form-row"><label>Число игроков:</label>
      <select id="hs-count" onchange="UI.renderHotSeatSlots()">
        <option value="2">2 игрока</option><option value="3">3 игрока</option><option value="4" selected>4 игрока</option>
      </select>
      <label style="min-width:110px;">Размер карты:</label>
      <select id="hs-size"><option value="26">Средняя (26×18)</option><option value="34" selected>Большая (34×22)</option></select>
    </div>
    <div id="hs-slots" style="margin:12px 0;display:flex;flex-direction:column;gap:8px;"></div>
    <div style="margin-top:14px;text-align:right;">
      <button class="btn btn-gold" onclick="Game.startHotSeat()">⚔️ Запустить Hot-Seat</button>
    </div>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="screen-game" class="screen">
  <div id="top-bar">
    <div class="res-group" id="res-bar"></div>
    <div class="top-meta" id="turn-meta"></div>
    <div class="top-actions">
      <button class="btn btn-sm" onclick="SaveSys.saveGame()">💾 Сохр.</button>
      <button class="btn btn-sm" onclick="SaveSys.loadGame()">📂 Загр.</button>
      <button class="btn btn-sm btn-danger" onclick="UI.exitToMenu()">🚪 Меню</button>
    </div>
  </div>
  <div id="game-main">
    <div id="map-wrap">
      <canvas id="map-canvas"></canvas>
      <div id="objective-banner"></div>
    </div>
    <div id="side-panel">
      <div id="minimap-box"><canvas id="minimap-canvas"></canvas></div>
      <div class="panel-box">
        <div class="hero-header">
          <canvas id="side-hero-portrait" width="54" height="54"></canvas>
          <div class="hero-bars" id="side-hero-info"></div>
        </div>
        <div style="display:flex;gap:5px;margin-top:6px;">
          <button class="btn btn-sm" style="flex:1" onclick="UI.openHeroModal()">🧙 Герой</button>
          <button class="btn btn-sm" style="flex:1" onclick="UI.openSelectedTown()">🏰 Город</button>
        </div>
        <div class="army-grid" id="side-army"></div>
      </div>
      <div class="panel-box">
        <div style="font-size:12px;color:var(--gold);margin-bottom:4px;">Герои и Города</div>
        <div class="list-scroll" id="side-entities"></div>
      </div>
      <button class="btn btn-gold" id="btn-end-turn" style="margin-top:auto;padding:12px;" onclick="Game.endTurn()">⌛ Конец хода</button>
    </div>
  </div>
</div>

<!-- МОДАЛКИ: ГОРОД, ГЕРОЙ, БОЙ, СУНДУК, ЛЕВЕЛАП, КАТ-СЦЕНА, HOT-SEAT, ИТОГИ, ЛОР -->
<div id="modal-town" class="modal"><div class="modal-box" id="town-content"></div></div>
<div id="modal-hero" class="modal"><div class="modal-box" id="hero-content"></div></div>
<div id="modal-battle" class="modal"><div class="modal-box" id="battle-box"></div></div>
<div id="modal-chest" class="modal"><div class="modal-box" style="max-width:460px;" id="chest-content"></div></div>
<div id="modal-levelup" class="modal"><div class="modal-box" style="max-width:520px;" id="levelup-content"></div></div>
<div id="modal-cutscene" class="modal"><div class="modal-box" style="max-width:760px;" id="cutscene-content"></div></div>
<div id="modal-hotseat-turn" class="modal"><div class="modal-box" style="max-width:460px;text-align:center;" id="hotseat-turn-content"></div></div>
<div id="modal-result" class="modal"><div class="modal-box" style="max-width:520px;text-align:center;" id="result-content"></div></div>
<div id="modal-lore" class="modal"><div class="modal-box" style="max-width:860px;" id="lore-content"></div></div>

<script>
"use strict";
// ==================== БЛОК 2: РЕСУРСЫ, ФРАКЦИИ, ГЕРОИ, БОССЫ, БЕСТИАРИЙ ====================
const RES_META = {
  gold:     { name: "Золото",       icon: "🪙", color: "#f0c84b" },
  wood:     { name: "Древесина",    icon: "🪵", color: "#b57b42" },
  stone:    { name: "Камень",       icon: "🪨", color: "#a5adb5" },
  emeralds: { name: "Изумруды",     icon: "💚", color: "#3ee07a" },
  stardust: { name: "Звёздная пыль",icon: "✨", color: "#c28bff" }
};

const MINE_TYPES = {
  gold_pit:  { name: "Золотой рудник",  res: "gold",     amount: 500,  icon: "⛏️" },
  gold_mine: { name: "Золотая шахта",   res: "gold",     amount: 1000, icon: "💰" },
  sawmill:   { name: "Лесопилка",       res: "wood",     amount: 2,    icon: "🪓" },
  quarry:    { name: "Каменный рудник", res: "stone",    amount: 2,    icon: "⛰️" },
  emerald:   { name: "Изумрудная шахта",res: "emeralds", amount: 1,    icon: "💎" },
  altar:     { name: "Алтарь богов",    res: "stardust", amount: 1,    icon: "🌟" }
};

const ADMIN_LEVELS = [
  { lvl: 1, name: "Ратуша",        income: 500,  cost: { gold: 0 } },
  { lvl: 2, name: "Управа",        income: 1000, cost: { gold: 2000, wood: 4, stone: 4 } },
  { lvl: 3, name: "Муниципалитет", income: 2000, cost: { gold: 4500, wood: 8, stone: 8, emeralds: 2, stardust: 2 } }
];

const GUILD_LEVELS = [
  { lvl: 1, name: "Гильдия магов I",   cost: { gold: 1500, wood: 4, stone: 4 } },
  { lvl: 2, name: "Гильдия магов II",  cost: { gold: 3000, wood: 6, stone: 6, emeralds: 2, stardust: 2 } },
  { lvl: 3, name: "Гильдия магов III", cost: { gold: 5000, wood: 8, stone: 8, emeralds: 4, stardust: 4 } }
];

const DWELLING_COSTS = {
  1: [{ gold: 600,  wood: 3 }, { gold: 900,  wood: 4, stone: 2 }],
  2: [{ gold: 1200, wood: 4, stone: 3 }, { gold: 1600, wood: 5, stone: 4 }],
  3: [{ gold: 2200, wood: 5, stone: 5 }, { gold: 2800, wood: 6, stone: 6, emeralds: 1 }],
  4: [{ gold: 3500, wood: 6, stone: 6, emeralds: 2 }, { gold: 4200, wood: 7, stone: 7, emeralds: 2, stardust: 2 }],
  5: [{ gold: 5500, wood: 8, stone: 8, emeralds: 3, stardust: 3 }, { gold: 7000, wood: 10, stone: 10, emeralds: 4, stardust: 4 }]
};

const FACTIONS = {
  humans: {
    id: "humans", name: "Люди", townName: "Город Ангелов", biome: "humans",
    color: "#3b82d6", accent: "#f2d06b", heroId: "valentin",
    desc: "Светлая дисциплина, стальные латы и сотрудники ЦИТа на передовой."
  },
  chaos: {

// Расчёт характеристик героя с учётом экипировки и бонусов сетов
function getHeroSetBonuses(hero) {
  const eqIds = new Set(Object.values(hero.equip || {}).filter(Boolean));
  const activeSets = [];
  const bonus = { atk:0, def:0, sp:0, kn:0, archery:0, lead:0, hp:0, move:0, goldDay:0 };
  eqIds.forEach(id => {
    const art = ART_MAP[id];
    if (!art) return;
    for (const [k, v] of Object.entries(art.bonus)) bonus[k] = (bonus[k] || 0) + v;
  });
  Object.values(ARTIFACT_SETS).forEach(s => {
    const have = s.items.filter(id => eqIds.has(id)).length;
    if (have === s.items.length) {
      activeSets.push(s);
      for (const [k, v] of Object.entries(s.bonus)) bonus[k] = (bonus[k] || 0) + v;
    }
  });
  return { bonus, activeSets };
}

function getHeroStats(hero) {
  const { bonus, activeSets } = getHeroSetBonuses(hero);
  const s = hero.stats;
  return {
    atk: s.atk + bonus.atk,
    def: s.def + bonus.def,
    sp: s.sp + bonus.sp,
    kn: s.kn + bonus.kn,
    archery: s.archery + bonus.archery,
    lead: s.lead + bonus.lead,
    maxHp: (hero.baseHp || 130) + (hero.level - 1) * 18 + bonus.hp,

      const echoLP = ctx.createBiquadFilter(); echoLP.type = "lowpass"; echoLP.frequency.value = 2100;
      echoFb = ctx.createGain(); echoFb.gain.value = 0.28;
      echoIn.connect(delayNode); delayNode.connect(echoLP);
      echoLP.connect(echoFb); echoFb.connect(delayNode);
      echoLP.connect(musGain);

      musGain.connect(comp); sfxGain.connect(comp);
      comp.connect(master); master.connect(ctx.destination);

      const len = ctx.sampleRate * 1.2;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return true;
  }

  function note(freq, t, dur, type, vol, dest, slideTo = null) {
    if (!ctx || !freq || muted) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.onended = () => { safeDisc(o); safeDisc(g); };
    o.start(t); o.stop(t + dur + 0.03);
  }

  function noise(t, dur, filterType, freq, q, vol, dest, freqEnd = null) {
    if (!ctx || !noiseBuf || muted) return;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = filterType;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, freqEnd), t + dur);
    f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.015, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest);
    src.onended = () => { safeDisc(src); safeDisc(f); safeDisc(g); };
    src.start(t); src.stop(t + dur + 0.03);
  }

  // 9 тембров с обязательной очисткой аудио-узлов (без утечек CPU и подвисаний)
  function playVoice(inst, midi, t, dur, vol, sendEcho = true) {
    if (!ctx || !midi || muted) return;
    const freq = m2f(midi);
    const out = ctx.createGain();
    out.gain.value = vol;
    out.connect(musGain);
    if (sendEcho && echoIn) out.connect(echoIn);

    if (inst === "flute") {
      const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lfoG = ctx.createGain(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(freq, t);
      lfo.frequency.value = 5.2; lfoG.gain.value = freq * 0.007;
      lfo.connect(lfoG); lfoG.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.95, t + Math.min(0.055, dur * 0.28));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.05);
      o.connect(g); g.connect(out);
      o.onended = () => { safeDisc(o); safeDisc(lfo); safeDisc(lfoG); safeDisc(g); safeDisc(out); };
      o.start(t); lfo.start(t); o.stop(t + dur * 1.08); lfo.stop(t + dur * 1.08);
    } else if (inst === "lute" || inst === "harp") {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = inst === "lute" ? "sawtooth" : "triangle";
      o.frequency.setValueAtTime(freq, t);
      f.type = "lowpass";
      f.frequency.setValueAtTime(inst === "lute" ? freq * 4.8 : freq * 6, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(180, freq * 1.25), t + dur * 0.9);
      const tail = inst === "harp" ? dur * 1.4 : dur * 0.92;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tail);
      o.connect(f); f.connect(g); g.connect(out);
      o.onended = () => { safeDisc(o); safeDisc(f); safeDisc(g); safeDisc(out); };
      o.start(t); o.stop(t + tail + 0.03);
    } else if (inst === "strings" || inst === "choir") {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(freq, t);
      f.type = inst === "choir" ? "bandpass" : "lowpass";
      f.frequency.setValueAtTime(inst === "choir" ? 780 : Math.min(2600, freq * 3.5), t);
      f.Q.value = inst === "choir" ? 2.4 : 0.8;
      const tail = dur * 1.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.8, t + Math.min(0.14, dur * 0.36));
      g.gain.exponentialRampToValueAtTime(0.0001, t + tail);
      o.connect(f); f.connect(g); g.connect(out);
      o.onended = () => { safeDisc(o); safeDisc(f); safeDisc(g); safeDisc(out); };
      o.start(t); o.stop(t + tail + 0.03);
    } else if (inst === "brass") {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(freq, t);
      f.type = "lowpass"; f.Q.value = 1.4;
      f.frequency.setValueAtTime(freq * 1.3, t);
      f.frequency.exponentialRampToValueAtTime(Math.min(3800, freq * 4.8), t + Math.min(0.07, dur * 0.3));
      f.frequency.exponentialRampToValueAtTime(freq * 2.0, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.95, t + 0.032);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.02);
      o.connect(f); f.connect(g); g.connect(out);
      o.onended = () => { safeDisc(o); safeDisc(f); safeDisc(g); safeDisc(out); };
      o.start(t); o.stop(t + dur * 1.05);
    } else if (inst === "organ") {
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain(), g = ctx.createGain();
      o1.type = "triangle"; o2.type = "sine";
      o1.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq * 2, t);
      g2.gain.value = 0.35;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.8, t + 0.025);
      g.gain.setValueAtTime(0.72, t + Math.max(0.04, dur * 0.85));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.05);
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
      o1.onended = () => { safeDisc(o1); safeDisc(o2); safeDisc(g2); safeDisc(g); safeDisc(out); };
      o1.start(t); o2.start(t); o1.stop(t + dur * 1.08); o2.stop(t + dur * 1.08);

      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();

      f.type = "bandpass"; f.frequency.setValueAtTime(Math.min(4400, freq * 3.2), t); f.Q.value = 0.8;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.95, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.82);
      o.connect(f); f.connect(g); g.connect(out);
      o.onended = () => { safeDisc(o); safeDisc(f); safeDisc(g); safeDisc(out); };
      o.start(t); o.stop(t + dur * 0.86);
    } else { // Колокольчики (bell)
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain(), g = ctx.createGain();
      const tail = Math.max(0.28, dur * 1.45);
      o1.type = "sine"; o2.type = "sine";
      o1.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq * 2.756, t);
      g2.gain.value = 0.28;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.75, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tail);
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
      o1.onended = () => { safeDisc(o1); safeDisc(o2); safeDisc(g2); safeDisc(g); safeDisc(out); };
      o1.start(t); o2.start(t); o1.stop(t + tail + 0.03); o2.stop(t + tail * 0.75);
    }
  }

  function playArp(kind, chord, pos, t, stepSec, inst) {
    if (!chord || !chord.length || kind === "none") return;
    const n = chord.length;
    if (kind === "jig") playVoice(inst, chord[[0, 1, 2, 1, 2, 0][pos % 6] % n] + (pos === 4 ? 12 : 0), t, stepSec * 1.25, 0.08, false);
    else if (kind === "harp") playVoice("harp", chord[[0, 1, 2, 1][pos % 4] % n] + (pos % 4 === 2 ? 12 : 0), t, stepSec * 1.6, 0.075);
    else if (kind === "chimes" && pos % 2 === 1) playVoice("bell", chord[(pos >> 1) % n] + 12, t, stepSec * 1.8, 0.055);
    else if (kind === "ostinato") playVoice("strings", (pos % 2 === 0 ? chord[0] : chord[2 % n]) - 12, t, stepSec * 0.8, 0.085, false);
    else if (kind === "tribal" && (pos === 0 || pos === 2)) playVoice("lute", chord[0] - (pos === 0 ? 12 : 5), t, stepSec * 1.0, 0.09, false);
    else if (kind === "baroque") playVoice("harpsichord", chord[[0, 2, 1, 2][pos % 4] % n], t, stepSec * 0.85, 0.07, false);
  }

  function playPerc(kind, pos, barLen, t) {
    if (kind === "battle" || kind === "march") {
      if (pos === 0) note(118, t, 0.12, "sine", 0.32, musGain, 36);
      if (pos === 2) { noise(t, 0.08, "highpass", 1300, 1.1, 0.16, musGain); note(96, t, 0.08, "sine", 0.18, musGain, 45); }
      if (pos % 2 === 1) noise(t, 0.03, "highpass", 5200, 1.8, 0.06, musGain);
    } else if (kind === "tribal") {
      if (pos === 0 || pos === 1) note(96, t, 0.15, "sine", 0.32, musGain, 38);
      if (pos === 2) noise(t, 0.07, "bandpass", 820, 1.4, 0.14, musGain);
      if (pos === 3) note(130, t, 0.08, "triangle", 0.16, musGain, 62);
    } else if (kind === "tavern") {
      if (pos === 0) note(108, t, 0.1, "sine", 0.22, musGain, 48);
      if (pos === 3) noise(t, 0.05, "bandpass", 2800, 2, 0.09, musGain);
    } else if (kind === "hell") {
      if (pos === 0) note(76, t, 0.2, "sine", 0.28, musGain, 30);
      if (pos === 2) noise(t, 0.1, "bandpass", 500, 1.2, 0.11, musGain, 180);
    } else if (kind === "cathedral" && pos === 0 && stepIdx % (barLen * 2) === 0) {
      note(65, t, 0.36, "sine", 0.2, musGain, 32);
    }
  }

  function scheduleStep(t) {
    const tr = MUSIC_TRACKS[currentTheme] || MUSIC_TRACKS.menu;
    const part = tr.parts[tr.order[partPos % tr.order.length]];
    const len = part.m.length, i = stepIdx % len;
    const bar = Math.floor(i / tr.barLen), pos = i % tr.barLen;
    const chord = part.c[bar % part.c.length], stepSec = tr.ms / 1000;

    if (echoIn) echoIn.gain.setTargetAtTime((tr.echo || 0.22) * 0.75, t, 0.12);
    const leadNote = part.m[i];
    if (leadNote) {
      let durSteps = 1;
      while (i + durSteps < len && part.m[i + durSteps] === 0 && durSteps < 3) durSteps++;
      const oct = (cycleIdx % 2 === 1 && partPos % 4 === 2 && leadNote < 74) ? 12 : 0;
      playVoice(tr.inst.lead, leadNote + oct, t, stepSec * durSteps * 0.92, 0.17);
    }
    const harmNote = part.h ? part.h[i] : 0;
    if (harmNote && (cycleIdx % 2 === 0 || pos % 2 === 0)) {
      playVoice(tr.inst.counter, harmNote, t, stepSec * 1.25, 0.095);
    }
    if (pos === 0 && chord) {
      playVoice(tr.inst.bass, chord[0] - 12, t, stepSec * tr.barLen * 0.9, 0.15, false);
      chord.forEach(cn => playVoice(tr.inst.pad, cn, t, stepSec * tr.barLen * 0.96, 0.05, false));
    }
    playArp(tr.arp, chord, pos, t, stepSec, tr.inst.counter);
    if (tr.perc && tr.perc !== "none") playPerc(tr.perc, pos, tr.barLen, t);

    stepIdx++;
    if (stepIdx >= len) {
      stepIdx = 0; partPos++;
      if (partPos >= tr.order.length) { partPos = 0; cycleIdx++; }
    }
    return stepSec;
  }

  function schedulerTick() {
    if (!ctx || muted || document.hidden) return;
    if (ctx.state === "suspended") { ctx.resume().catch(() => {}); return; }
    const now = ctx.currentTime;
    if (nextNoteTime < now - 0.2) nextNoteTime = now + 0.05; // Защита от «залпа» после лага/вкладки
    let guard = 0;
    while (nextNoteTime < now + 0.15 && guard++ < 4) {
      nextNoteTime += scheduleStep(nextNoteTime);
    }
  }

  function startLoop() {
    if (!ctx) return;
    nextNoteTime = ctx.currentTime + 0.06;
    if (!timer) timer = setInterval(schedulerTick, 40);
  }

  function playMusic(theme) {
    const next = MUSIC_TRACKS[theme] ? theme : "menu";
    if (currentTheme === next && timer) return;
    currentTheme = next; stepIdx = 0; partPos = 0; cycleIdx = 0;
    if (ctx) { nextNoteTime = ctx.currentTime + 0.06; if (!timer) startLoop(); }
  }

  function play(name) {
    if (muted || !ensureCtx()) return;
    const t = ctx.currentTime + 0.01;
    switch (name) {
      case "click":   note(540, t, 0.045, "triangle", 0.2, sfxGain, 280); break;
      case "gold":    [1568, 2093, 2637, 3136].forEach((f, i) => { note(f, t + i * 0.055, 0.22, "sine", 0.22, sfxGain); note(f * 1.5, t + i * 0.055, 0.14, "triangle", 0.09, sfxGain); }); break;
      case "sword":   noise(t, 0.11, "bandpass", 1600, 1.8, 0.25, sfxGain, 450); [980, 1480, 2320].forEach((f, i) => note(f, t + 0.05, 0.22 - i * 0.04, "sawtooth", 0.13, sfxGain, f * 0.88)); noise(t + 0.05, 0.14, "highpass", 2800, 2, 0.22, sfxGain); break;
      case "club":    note(155, t, 0.26, "sine", 0.55, sfxGain, 34); note(95, t, 0.22, "triangle", 0.35, sfxGain, 28); noise(t, 0.18, "lowpass", 360, 1.2, 0.42, sfxGain, 90); break;
      case "bow":     note(340, t, 0.075, "triangle", 0.28, sfxGain, 125); noise(t + 0.03, 0.22, "bandpass", 2200, 3.2, 0.24, sfxGain, 700); break;
      case "fire":    note(120, t, 0.45, "sawtooth", 0.3, sfxGain, 36); noise(t, 0.52, "lowpass", 750, 0.9, 0.45, sfxGain, 130); noise(t + 0.05, 0.38, "bandpass", 1300, 1.1, 0.22, sfxGain, 260); break;
      case "build":   noise(t, 0.14, "bandpass", 1500, 2.2, 0.24, sfxGain, 950); noise(t + 0.16, 0.14, "bandpass", 1100, 2.2, 0.22, sfxGain, 1650); [0.34, 0.5, 0.66].forEach(dt => { note(210, t + dt, 0.08, "triangle", 0.34, sfxGain, 65); noise(t + dt, 0.06, "highpass", 1800, 1.5, 0.22, sfxGain); }); break;
      case "magic":   [523, 659, 784, 1046, 1318].forEach((f, i) => note(f, t + i * 0.04, 0.18, "sine", 0.18, sfxGain, f * 1.12)); break;
      case "heal":    [523, 659, 784, 1046].forEach((f, i) => note(f, t + i * 0.07, 0.32, "triangle", 0.2, sfxGain)); break;
      case "curse":   [370, 349, 262, 233].forEach((f, i) => note(f, t + i * 0.07, 0.26, "sawtooth", 0.16, sfxGain, f * 0.9)); break;
      case "levelup": [523, 659, 784, 1046, 1318].forEach((f, i) => note(f, t + i * 0.08, 0.34, "triangle", 0.26, sfxGain)); break;
      case "step":    noise(t, 0.045, "lowpass", 420, 1, 0.12, sfxGain); break;
      case "death":   note(220, t, 0.38, "sawtooth", 0.26, sfxGain, 62); noise(t, 0.25, "lowpass", 400, 1, 0.22, sfxGain, 80); break;
      case "fanfare": [523, 659, 784, 1046].forEach((f, i) => note(f, t + i * 0.09, 0.45, "sawtooth", 0.2, sfxGain)); break;
    }
  }

  function unlock() { if (ensureCtx() && !timer) startLoop(); }
  window.addEventListener("pointerdown", unlock, { once: true });
  window.addEventListener("keydown", unlock, { once: true });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ctx) { ctx.resume().catch(() => {}); nextNoteTime = ctx.currentTime + 0.08; }
  });

  const btn = document.getElementById("audio-toggle");
  const volEl = document.getElementById("audio-vol");
  btn.addEventListener("click", () => {
    ensureCtx(); muted = !muted;
    if (master) master.gain.value = muted ? 0 : volume;
    btn.textContent = muted ? "🔇 Тихо" : "🔊 Звук";
    if (!muted) { nextNoteTime = ctx.currentTime + 0.06; play("click"); }
  });
  volEl.addEventListener("input", e => {
    volume = parseFloat(e.target.value);
    if (master && !muted) master.gain.value = volume;
  });

  return {
    play, playMusic,
    playMapMusic: b => playMusic("map_" + (MUSIC_TRACKS["map_" + b] ? b : "humans")),
    playTownMusic: f => playMusic("town_" + (MUSIC_TRACKS["town_" + f] ? f : "humans")),
    stopMusic: () => { if (timer) { clearInterval(timer); timer = null; } }
  };
})();

  function sparkle(c, x, y, r, col = "#fff9c4") {
    if (r <= 0.4) return;
    c.save(); c.fillStyle = col; c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4, rad = i % 2 === 0 ? r : r * 0.25;
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath(); c.fill(); c.restore();
  }

  // Анимированное развевающееся знамя (для замков, шахт и героев)
  function drawFlag(ctx, x, y, color, sc = 1, phase = 0) {
    const t = nowT() * 5.2 + phase + x * 0.04;
    const w1 = Math.sin(t) * 2.2 * sc, w2 = Math.sin(t - 1.3) * 3.4 * sc;
    const h = 18 * sc, fw = 14 * sc, fh = 8.5 * sc;
    ln(ctx, x, y, x, y - h, "#c9a66b", 1.8 * sc);
    orb(ctx, x, y - h - 1.5 * sc, 2.2 * sc, "#fff4b0", "#f0c243", "#7a5210");
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.quadraticCurveTo(x + fw * 0.5, y - h + w1, x + fw, y - h + 1 * sc + w2);
    ctx.lineTo(x + fw * 0.78, y - h + fh * 0.5 + w2 * 0.85);
    ctx.lineTo(x + fw, y - h + fh + w2);
    ctx.quadraticCurveTo(x + fw * 0.5, y - h + fh + w1, x, y - h + fh);
    ctx.closePath();
    ctx.fillStyle = color || "#999"; ctx.fill();
    ctx.strokeStyle = "rgba(255,235,170,0.65)"; ctx.lineWidth = 0.8 * sc; ctx.stroke();
    // Складка ткани на свету
    ctx.strokeStyle = "rgba(255,255,255,0.32)"; ctx.lineWidth = 1.2 * sc;
    ctx.beginPath();
    ctx.moveTo(x + 2 * sc, y - h + 2.2 * sc);
    ctx.quadraticCurveTo(x + fw * 0.5, y - h + 2.2 * sc + w1, x + fw * 0.82, y - h + 2.8 * sc + w2);
    ctx.stroke();
  }

  // Высокий флаг цвета фракции за спиной героя на карте мира
  function drawHeroFlag(ctx, sx, sy, sz, factionColor, ownerColor, seed = 0) {
    const fx = sx + sz * 0.2, fy = sy + sz * 0.72;
    drawFlag(ctx, fx, fy, factionColor, (sz / 52) * 1.12, seed);
    if (ownerColor && ownerColor !== factionColor) {
      circ(ctx, fx, fy - 19 * (sz / 52), 3, ownerColor, "#fff", 0.9);
    }
  }

  function drawTile(ctx, x, y, sz, tile, biomeId, tx, ty) {
    const b = BIOMES[biomeId] || BIOMES.humans, h = hash(tx, ty), h2 = hash(tx + 17, ty + 31), t = nowT();
    const g = ctx.createLinearGradient(x, y, x + sz, y + sz);
    g.addColorStop(0, (tx + ty) % 2 === 0 ? b.g1 : b.g2);
    g.addColorStop(1, (tx + ty) % 2 === 0 ? b.g2 : b.g1);
    ctx.fillStyle = g; ctx.fillRect(x, y, sz, sz);

    // Органические детали рельефа и колышущаяся трава
    if (tile.t === 0) {
      if (biomeId === "death_epic" && h > 0.65) {
        const gl = 0.35 + 0.25 * Math.sin(t * 2.4 + h * 10);
        ln(ctx, x + 5, y + sz * h, x + sz * 0.5, y + sz * 0.52, `rgba(255,70,25,${gl})`, 1.8);
        ln(ctx, x + sz * 0.5, y + sz * 0.52, x + sz - 5, y + sz * (1 - h2), `rgba(255,175,60,${gl})`, 1.1);
      } else if ((biomeId === "humans" || biomeId === "elves") && h > 0.45) {
        const sway = Math.sin(t * 2.1 + tx * 0.7 + ty * 0.5) * 1.6;
        const gx = x + 7 + h2 * (sz - 14), gy = y + 11 + h * (sz - 17);
        ln(ctx, gx, gy, gx - 2.5 + sway, gy - 5.5, b.t3, 1.3);
        ln(ctx, gx + 2, gy, gx + 3 + sway, gy - 4.5, b.t2, 1.2);
        if (h > 0.8) circ(ctx, gx + 2 + sway, gy - 5.5, 1.8, biomeId === "elves" ? "#8ef7ff" : (h2 > 0.5 ? "#ffe875" : "#fff5f5"));
      } else if (h > 0.58) {
        ell(ctx, x + 6 + h2 * (sz - 12), y + 6 + h * (sz - 12), 4.5, 2.4, "rgba(0,0,0,0.13)");
      }
    }

    if (tile.t === 1) { // Каменная мощёная дорога со светотенью
      ell(ctx, x + sz * 0.5, y + sz * 0.5, sz * 0.44, sz * 0.44, "rgba(0,0,0,0.16)");
      ctx.fillStyle = b.road; ctx.fillRect(x + sz * 0.16, y + sz * 0.16, sz * 0.68, sz * 0.68);
      for (let i = 0; i < 4; i++) {
        const px = x + sz * (0.25 + (i % 2) * 0.42 + (h - 0.5) * 0.1);
        const py = y + sz * (0.27 + Math.floor(i / 2) * 0.42);
        ell(ctx, px, py, sz * 0.12, sz * 0.08, "rgba(255,248,230,0.22)", "rgba(50,35,20,0.22)", 0.9);
      }
    } else if (tile.t === 2) { // Анимированная вода с бликами или кипящая лава
      const wg = ctx.createLinearGradient(x, y, x, y + sz);
      wg.addColorStop(0, b.wat); wg.addColorStop(1, b.lava ? "#8c1608" : "#103c63");
      ctx.fillStyle = wg; ctx.fillRect(x, y, sz, sz);
      if (b.lava) {
        const pulse = Math.sin(t * 2.6 + tx + ty * 1.4);
        ell(ctx, x + sz * 0.38, y + sz * 0.42, sz * (0.2 + pulse * 0.03), sz * 0.11, "#ff7b1c");
        ell(ctx, x + sz * 0.68, y + sz * 0.72, sz * 0.17, sz * 0.09, "#ffbe3b");
        const br = 1.5 + Math.abs(Math.sin(t * 3.2 + h * 9)) * 2.8;
        circ(ctx, x + sz * (0.3 + h * 0.45), y + sz * (0.3 + h2 * 0.45), br, "#fff294");
      } else {
        const shift = Math.sin(t * 2.4 + tx * 0.8 + ty * 1.2) * 4;
        ctx.strokeStyle = "rgba(215,245,255,0.42)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x + 4 + shift, y + sz * 0.34); ctx.quadraticCurveTo(x + sz * 0.5 + shift, y + sz * 0.24, x + sz - 5 + shift, y + sz * 0.36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 8 - shift, y + sz * 0.68); ctx.quadraticCurveTo(x + sz * 0.5 - shift, y + sz * 0.58, x + sz - 8 - shift, y + sz * 0.7); ctx.stroke();
        if (Math.sin(t * 3 + h * 15) > 0.75) sparkle(ctx, x + sz * h2, y + sz * h, 3.2, "rgba(255,255,255,0.8)");
      }
    } else if (tile.t === 3) { // Объёмный живой лес (колышется на ветру)
      const sway = Math.sin(t * 1.9 + tx * 0.9 + ty * 0.6) * 1.5;
      ell(ctx, x + sz * 0.5, y + sz * 0.86, sz * 0.35, sz * 0.11, "rgba(0,0,0,0.36)");
      if (biomeId === "death" || biomeId === "death_epic" || biomeId === "chaos") {
        ln(ctx, x + sz * 0.5, y + sz * 0.85, x + sz * 0.48 + sway * 0.4, y + sz * 0.34, "#291c1c", 4.5);
        ln(ctx, x + sz * 0.48, y + sz * 0.52, x + sz * 0.2 + sway, y + sz * 0.26, "#291c1c", 2.5);
        ln(ctx, x + sz * 0.48, y + sz * 0.45, x + sz * 0.78 + sway, y + sz * 0.21, "#291c1c", 2.5);
        if (b.lava) circ(ctx, x + sz * 0.75 + sway, y + sz * 0.21, 2.2 + Math.sin(t * 5 + h * 7), "#ff8426");
      } else {
        const tg = ctx.createLinearGradient(x + sz * 0.42, 0, x + sz * 0.58, 0);
        tg.addColorStop(0, "#754b27"); tg.addColorStop(1, "#38210f");
        ctx.fillStyle = tg; ctx.fillRect(x + sz * 0.43, y + sz * 0.54, sz * 0.14, sz * 0.32);
        orb(ctx, x + sz * 0.34 + sway * 0.7, y + sz * 0.46, sz * 0.23, b.t2, b.tree, "#0c2410");
        orb(ctx, x + sz * 0.66 + sway * 0.7, y + sz * 0.46, sz * 0.23, b.t2, b.tree, "#0c2410");
        orb(ctx, x + sz * 0.5 + sway, y + sz * 0.3, sz * 0.26, b.t3, b.t2, b.tree);
      }
    } else if (tile.t === 4) { // Реалистичные гранёные горы со светотенью и дымящимися вулканами
      ell(ctx, x + sz * 0.5, y + sz * 0.88, sz * 0.46, sz * 0.11, "rgba(0,0,0,0.38)");
      poly(ctx, [[x + 1, y + sz - 4], [x + sz * 0.32, y + sz * 0.22], [x + sz * 0.48, y + sz - 4]], b.rock);
      poly(ctx, [[x + sz * 0.32, y + sz * 0.22], [x + sz * 0.64, y + sz - 4], [x + sz * 0.46, y + sz - 4]], b.rock2);
      poly(ctx, [[x + sz * 0.32, y + sz - 4], [x + sz * 0.68, y + 4], [x + sz * 0.7, y + sz - 4]], b.rock);
      poly(ctx, [[x + sz * 0.68, y + 4], [x + sz - 1, y + sz - 4], [x + sz * 0.69, y + sz - 4]], b.rock2);
      if (b.lava) {
        const sm = (t * 0.6 + h) % 1;
        circ(ctx, x + sz * 0.68 + Math.sin(t + h * 5) * 3, y + 4 - sm * 10, 3 + sm * 4, `rgba(90,65,60,${0.45 * (1 - sm)})`);
        poly(ctx, [[x + sz * 0.61, y + 8], [x + sz * 0.68, y + 4], [x + sz * 0.75, y + 9], [x + sz * 0.68, y + 13]], "#ff6a1a");
        circ(ctx, x + sz * 0.68, y + 8, 2.2, "#fff08a");
      } else if (biomeId === "humans" || biomeId === "elves") {
        poly(ctx, [[x + sz * 0.57, y + 16], [x + sz * 0.68, y + 4], [x + sz * 0.71, y + 14], [x + sz * 0.64, y + 13]], "#f5faff");
        poly(ctx, [[x + sz * 0.68, y + 4], [x + sz * 0.79, y + 16], [x + sz * 0.71, y + 14]], "#c2d6eb");
      }
    } else if (tile.t === 5) { // Пульсирующий рунный обелиск тьмы
      const p = 0.5 + 0.5 * Math.sin(t * 3 + tx);
      ell(ctx, x + sz * 0.5, y + sz * 0.84, sz * 0.34, sz * 0.11, `rgba(190,70,255,${0.2 + p * 0.25})`);
      poly(ctx, [[x + sz * 0.5, y + 3], [x + sz * 0.67, y + sz * 0.76], [x + sz * 0.5, y + sz * 0.78]], "#170e21");
      poly(ctx, [[x + sz * 0.5, y + 3], [x + sz * 0.33, y + sz * 0.76], [x + sz * 0.5, y + sz * 0.78]], "#34224a");
      ln(ctx, x + sz * 0.5, y + 12, x + sz * 0.5, y + sz * 0.66, `rgba(220,120,255,${0.55 + p * 0.45})`, 2.2);
      circ(ctx, x + sz * 0.5 + Math.cos(t * 2.5) * 9, y + sz * 0.35 + Math.sin(t * 2.5) * 4, 2, "#ff9ef5");
    }
  }

  // Объёмные замки 5 фракций на карте с развевающимися флагами
  function drawTownIcon(ctx, x, y, sz, factionId, ownerColor) {
    const cx = x + sz / 2, by = y + sz - 4, t = nowT();
    ell(ctx, cx, by, sz * 0.46, 5.5, "rgba(0,0,0,0.48)");
    const wall = (rx, ry, rw, rh, c1, c2) => {
      const g = ctx.createLinearGradient(rx, ry, rx + rw, ry);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
      ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 0.8; ctx.strokeRect(rx, ry, rw, rh);
    };
    if (factionId === "humans") {
      wall(x + 7, y + sz * 0.44, sz - 14, sz * 0.46, "#f2ede2", "#b5ad9e");
      wall(x + 4, y + sz * 0.27, 10, sz * 0.63, "#f7f3ea", "#aba393");
      wall(x + sz - 14, y + sz * 0.27, 10, sz * 0.63, "#f7f3ea", "#aba393");
      wall(cx - 8, y + sz * 0.22, 16, sz * 0.68, "#faf6ee", "#b8b0a0");
      poly(ctx, [[x + 2, y + sz * 0.28], [x + 9, y + 5], [x + 16, y + sz * 0.28]], "#2d68bf", "#f2cb57", 1);
      poly(ctx, [[x + sz - 16, y + sz * 0.28], [x + sz - 9, y + 5], [x + sz - 2, y + sz * 0.28]], "#2d68bf", "#f2cb57", 1);
      orb(ctx, cx, y + sz * 0.21, 7.5, "#fff5b8", "#f0c243", "#8c5f12");
      ctx.fillStyle = "#ffe680"; ctx.fillRect(cx - 2, y + sz * 0.42, 4, 5);
      ctx.fillStyle = "#24170d"; ctx.fillRect(cx - 5, by - 11, 10, 11);
    } else if (factionId === "chaos") {
      ell(ctx, cx, by - 1, sz * 0.44, 4.5, `rgba(255,95,20,${0.75 + 0.2 * Math.sin(t * 4)})`);
      poly(ctx, [[x + 4, by], [x + 9, y + 7], [x + 18, y + sz * 0.42], [cx, y + 3], [x + sz - 18, y + sz * 0.42], [x + sz - 9, y + 7], [x + sz - 4, by]], "#291418", "#ff6a1a", 1.2);
      orb(ctx, cx, y + sz * 0.42, 4.2, "#fff7b8", "#ff8426", "#a8240c");
      ctx.fillStyle = "#ff9d26"; ctx.fillRect(cx - 5, by - 12, 10, 12);
    } else if (factionId === "elves") {
      wall(cx - 8, y + sz * 0.42, 16, sz * 0.48, "#7d512c", "#3b2310");
      orb(ctx, x + sz * 0.28, y + sz * 0.45, sz * 0.19, "#48b865", "#227a3d", "#103b1d");
      orb(ctx, x + sz * 0.72, y + sz * 0.45, sz * 0.19, "#48b865", "#227a3d", "#103b1d");
      orb(ctx, cx, y + sz * 0.32, sz * 0.29, "#5cd479", "#248744", "#124221");
      wall(cx - 6, y + sz * 0.3, 12, 12, "#f7e7ba", "#bfa76b");
      poly(ctx, [[cx - 8, y + sz * 0.3], [cx, y + 6], [cx + 8, y + sz * 0.3]], "#f0c84b", "#8a6214", 0.9);
      ctx.fillStyle = "#1c120a"; ctx.fillRect(cx - 4, by - 10, 8, 10);
    } else if (factionId === "orcs") {
      wall(x + 6, y + sz * 0.44, sz - 12, sz * 0.46, "#8c6138", "#4d3219");
      for (let i = 0; i < 6; i++) {
        const px = x + 6 + i * ((sz - 12) / 5);
        poly(ctx, [[px - 2, y + sz * 0.46], [px, y + sz * 0.25], [px + 2, y + sz * 0.46]], "#9e7042", "#3b2410", 0.8);
      }
      poly(ctx, [[cx - 11, y + sz * 0.44], [cx, y + 6], [cx + 11, y + sz * 0.44]], "#9c3e22", "#ebd8b2", 1.2);
      orb(ctx, cx, by - 14, 4.5, "#fff8e8", "#ded4be", "#7a705c");
      ctx.fillStyle = "#1a110a"; ctx.fillRect(cx - 5, by - 10, 10, 10);
    } else {
      wall(x + 7, y + sz * 0.44, sz - 14, sz * 0.46, "#3b2f4d", "#1c1529");
      poly(ctx, [[x + 4, by], [x + 10, y + 5], [x + 16, by]], "#443659", "#5cf2c0", 1);
      poly(ctx, [[x + sz - 16, by], [x + sz - 10, y + 5], [x + sz - 4, by]], "#443659", "#5cf2c0", 1);
      poly(ctx, [[cx - 8, y + sz * 0.44], [cx, y + 2], [cx + 8, y + sz * 0.44]], "#261b38", "#c066ff", 1.1);
      circ(ctx, cx, y + sz * 0.54, 3 + Math.sin(t * 3.5) * 0.6, "#5cf2c0");
      ctx.fillStyle = "#100a17"; ctx.fillRect(cx - 5, by - 11, 10, 11);
    }
    const fCol = ownerColor || FACTIONS[factionId]?.color;
    if (fCol) drawFlag(ctx, cx, y + sz * 0.34, fCol, 1.05, x * 0.1);
  }

  // Анимированные шахты (пила крутится, кран качается, вагонетка ездит, алтарь парит!)
  function drawMine(ctx, x, y, sz, mineType, ownerColor) {
    const cx = x + sz / 2, by = y + sz - 5, t = nowT();
    ell(ctx, cx, by, sz * 0.42, 5.5, "rgba(0,0,0,0.42)");

    if (mineType === "sawmill") {
      // Дымок из трубы + вращающаяся пила
      const sm = (t * 0.55 + x * 0.03) % 1;
      circ(ctx, x + sz * 0.72 + Math.sin(t * 2) * 3, y + sz * 0.22 - sm * 13, 2.5 + sm * 4.5, `rgba(225,220,210,${0.48 * (1 - sm)})`);
      ctx.fillStyle = "#614231"; ctx.fillRect(x + sz * 0.66, y + sz * 0.18, 6, 12);
      ctx.fillStyle = "#8a5a30"; ctx.fillRect(x + 8, y + sz * 0.43, sz - 16, sz * 0.44);
      poly(ctx, [[x + 4, y + sz * 0.46], [cx, y + sz * 0.16], [x + sz - 4, y + sz * 0.46]], "#b34227", "#4a190d", 1.1);
      ctx.save(); ctx.translate(x + sz * 0.32, y + sz * 0.68); ctx.rotate(t * 6.5);
      circ(ctx, 0, 0, 7, "#dce4ed", "#5c6670", 1.4);
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ln(ctx, Math.cos(a) * 5, Math.sin(a) * 5, Math.cos(a) * 8.5, Math.sin(a) * 8.5, "#eef5fc", 1.2); }
      circ(ctx, 0, 0, 2, "#4a3320"); ctx.restore();
      [0, 1, 2].forEach(i => ell(ctx, x + sz * 0.7, y + sz * (0.79 - i * 0.11), 6, 3.2, "#c2884c", "#4d2f14", 1));
    } else if (mineType === "quarry") {
      poly(ctx, [[x + 4, by], [x + 12, y + sz * 0.28], [x + sz - 8, y + sz * 0.36], [x + sz - 3, by]], "#8f97a1", "#40464d", 1.2);
      ctx.fillStyle = "#cfd6de"; ctx.fillRect(x + 10, by - 12, 11, 9); ctx.fillRect(x + 22, by - 10, 12, 8);
      const lift = Math.sin(t * 2.2 + x) * 5;
      ln(ctx, x + sz * 0.72, by - 8, x + sz * 0.72, y + sz * 0.16, "#7a4e24", 2.6);
      ln(ctx, x + sz * 0.72, y + sz * 0.16, x + sz * 0.34, y + sz * 0.25 + lift * 0.25, "#7a4e24", 2.2);
      ln(ctx, x + sz * 0.38, y + sz * 0.25 + lift * 0.25, x + sz * 0.38, y + sz * 0.5 + lift, "#e0e0e0", 1.2);
      ctx.fillStyle = "#b8c2cc"; ctx.fillRect(x + sz * 0.38 - 4.5, y + sz * 0.5 + lift, 9, 7);
    } else if (mineType === "emerald") {
      poly(ctx, [[x + 4, by], [x + 14, y + sz * 0.23], [x + sz - 14, y + sz * 0.23], [x + sz - 4, by]], "#3c4749", "#1a2124", 1.2);
      ctx.fillStyle = "#0e1715"; ctx.fillRect(cx - 8, by - 15, 16, 15);
      poly(ctx, [[cx - 12, by - 2], [cx - 7, y + sz * 0.32], [cx - 2, by - 2]], "#2ee673", "#c4ffdb", 1);
      poly(ctx, [[cx + 2, by - 2], [cx + 8, y + sz * 0.22], [cx + 13, by - 2]], "#1fc75f", "#c4ffdb", 1);
      sparkle(ctx, cx + 8, y + sz * 0.3, 3.2 + Math.sin(t * 4.5 + x) * 1.8, "#d4ffe6");
    } else if (mineType === "altar") {
      const bob = Math.sin(t * 2.8 + y) * 3;
      ctx.fillStyle = "#bdb8cc"; ctx.fillRect(x + 7, by - 7, sz - 14, 7); ctx.fillRect(x + 12, by - 13, sz - 24, 6);
      ctx.fillStyle = "#e4e0f2"; ctx.fillRect(x + 12, y + sz * 0.3, 5, sz * 0.44); ctx.fillRect(x + sz - 17, y + sz * 0.3, 5, sz * 0.44);
      orb(ctx, cx, y + sz * 0.36 + bob, 9.5, "rgba(255,255,255,0.65)", "rgba(195,130,255,0.45)", "rgba(120,50,220,0)");
      poly(ctx, [[cx, y + sz * 0.19 + bob], [cx + 6, y + sz * 0.36 + bob], [cx, y + sz * 0.53 + bob], [cx - 6, y + sz * 0.36 + bob]], "#e5c2ff", "#fff", 1.1);
      circ(ctx, cx + Math.cos(t * 3) * 11, y + sz * 0.36 + Math.sin(t * 3) * 4, 2, "#fff5ff");
    } else { // Золотая шахта: выезжающая вагонетка + сверкающие самородки + работа кирки
      const rich = mineType === "gold_mine";
      poly(ctx, [[x + 4, by], [x + 13, y + sz * 0.2], [x + sz - 13, y + sz * 0.2], [x + sz - 4, by]], rich ? "#6b5a47" : "#595047", "#261f19", 1.2);
      ctx.fillStyle = "#120d0a"; ctx.fillRect(cx - 9, by - 17, 18, 17);
      ln(ctx, cx - 9, by, cx - 9, by - 17, "#946130", 2.4); ln(ctx, cx + 9, by, cx + 9, by - 17, "#946130", 2.4);
      ln(ctx, cx - 11, by - 17, cx + 11, by - 17, "#946130", 2.6);
      const slide = Math.sin(t * 1.8 + x) * 4.5;
      ln(ctx, cx - 4, by + 3, cx - 6, by - 7, "#9aa5b0", 1.4); ln(ctx, cx + 4, by + 3, cx + 6, by - 7, "#9aa5b0", 1.4);
      poly(ctx, [[cx - 7 + slide * 0.2, by - 2 + slide * 0.5], [cx + 7 + slide * 0.2, by - 2 + slide * 0.5], [cx + 9 + slide * 0.2, by - 9 + slide * 0.5], [cx - 9 + slide * 0.2, by - 9 + slide * 0.5]], "#4e565e", "#1c2024");
      orb(ctx, cx - 2 + slide * 0.2, by - 10 + slide * 0.5, 3.6, "#fff7b8", "#ffd23f", "#8a5a08");
      orb(ctx, cx + 3 + slide * 0.2, by - 10 + slide * 0.5, 3.4, "#fff7b8", "#f0b429", "#8a5a08");
      if (Math.sin(t * 5 + y) > 0.4) sparkle(ctx, cx + slide * 0.2, by - 12 + slide * 0.5, 3.5, "#fff8b8");
    }

  let townRaf = null, townLast = 0, activeTownCv = null, activeTownRef = null;

  function renderTownFrame(canvas, town) {
    if (!canvas || !town) return;
    if (canvas.width !== 600) canvas.width = 600;
    if (canvas.height !== 240) canvas.height = 240;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return;
    const f = FACTIONS[town.faction], b = BIOMES[f.biome] || BIOMES.humans, t = nowT();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 600, 240);
    drawTownBg(ctx, town.faction, f, b, t);
    if (town.tavernBuilt) drawTavernBuilding(ctx, t);
    drawAdminBuilding(ctx, town.faction, town.admin, t);
    drawMageGuild(ctx, town.faction, town.guild, t);
    const spots = [[68, 212], [174, 224], [295, 228], [416, 224], [524, 212]];
    town.dwellings.forEach((lvl, idx) => drawDwelling(ctx, town.faction, idx, lvl, spots[idx][0], spots[idx][1], t));
    ctx.fillStyle = "rgba(18,12,8,0.74)"; ctx.fillRect(10, 8, 368, 26);
    ctx.strokeStyle = "#8a6c27"; ctx.lineWidth = 1; ctx.strokeRect(10, 8, 368, 26);
    ctx.fillStyle = "#fff6dc"; ctx.font = "bold 14px Georgia"; ctx.textAlign = "left";
    ctx.fillText(`🏰 ${town.name} — ${ADMIN_LEVELS[town.admin - 1].name}`, 18, 26);
    ctx.restore();
  }

  function stepTownAnim(ts) {
    if (!activeTownCv || !activeTownRef || !activeTownCv.isConnected || !document.getElementById("modal-town")?.classList.contains("active")) {
      townRaf = null; return;
    }
    if (ts - townLast >= 34) { townLast = ts; renderTownFrame(activeTownCv, activeTownRef); }
    townRaf = requestAnimationFrame(stepTownAnim);
  }

  function drawTownScene(canvas, town) {
    if (!canvas || !town) return;
    activeTownCv = canvas; activeTownRef = town;
    renderTownFrame(canvas, town);
    if (!townRaf) townRaf = requestAnimationFrame(stepTownAnim);
  }

// ==================== БЛОК 5Б-1: ЖИВОПИСНЫЕ ГЕРОИ И ПЕРВЫЕ 20 ВОИНОВ (GFX 2.0) ====================
  function limb(ctx, x1, y1, x2, y2, w, col, hi = null) {
    ctx.save(); ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = w + 1.4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (hi) {
      ctx.strokeStyle = hi; ctx.lineWidth = Math.max(1, w * 0.32);
      ctx.beginPath(); ctx.moveTo(x1 - 0.6, y1 - 0.4); ctx.lineTo(x2 - 0.6, y2 - 0.4); ctx.stroke();
    }
    ctx.restore();
  }

  function gradBody(ctx, x, y, rx, ry, c1, c2, c3, st = "rgba(0,0,0,0.42)") {
    const g = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.35, 1, x, y, Math.max(rx, ry) * 1.25);
    g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, c3);
    ell(ctx, x, y, rx, ry, g, st, 1.1);
  }

  function drawCape(ctx, x, y, h, w, c1, c2, sway) {
    const g = ctx.createLinearGradient(x - w, y, x + w * 0.5, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.45, y);
    ctx.quadraticCurveTo(x - w - sway * 0.5, y + h * 0.55, x - w * 1.1 - sway, y + h);
    ctx.quadraticCurveTo(x - sway * 0.4, y + h + 2.5, x + w * 0.45 - sway * 0.3, y + h - 1);
    ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.45, x + w * 0.42, y);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 0.9; ctx.stroke();
  }

  function drawWing(ctx, x, y, side, span, flap, c1, c2, bat = false) {
    ctx.save(); ctx.translate(x, y); ctx.scale(side, 1);
    const fy = flap * 7.5;
    const g = ctx.createLinearGradient(0, -span * 0.6, span, span * 0.3);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath(); ctx.moveTo(0, 0);
    if (bat) {
      ctx.quadraticCurveTo(span * 0.55, -span * 0.65 + fy, span, -span * 0.35 + fy);
      ctx.quadraticCurveTo(span * 0.78, -span * 0.05 + fy * 0.6, span * 0.72, span * 0.25 + fy * 0.3);
      ctx.quadraticCurveTo(span * 0.45, span * 0.05, span * 0.35, span * 0.32);
      ctx.quadraticCurveTo(span * 0.16, span * 0.12, 0, span * 0.22);
    } else {
      ctx.quadraticCurveTo(span * 0.5, -span * 0.72 + fy, span, -span * 0.42 + fy);
      ctx.quadraticCurveTo(span * 0.95, span * 0.05 + fy * 0.5, span * 0.62, span * 0.28 + fy * 0.2);
      ctx.quadraticCurveTo(span * 0.32, span * 0.38, 0, span * 0.22);
    }
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.38)"; ctx.lineWidth = 0.9; ctx.stroke();
    if (!bat) {
      for (let i = 1; i <= 3; i++) ln(ctx, span * 0.15, i * 1.6, span * (0.95 - i * 0.15), -span * (0.38 - i * 0.14) + fy * (1 - i * 0.2), "rgba(255,255,255,0.42)", 0.9);
    }
    ctx.restore();
  }

  function bipedLegs(ctx, s, legC, bootC, y0 = 7, len = 12) {
    const lx = -3.6 - s * 4.8, ly = y0 + len - Math.max(0, s) * 2.2;
    const rx = 3.6 + s * 4.8, ry = y0 + len - Math.max(0, -s) * 2.2;
    limb(ctx, -3, y0, lx, ly, 4.2, legC);
    ell(ctx, lx + 1.2, ly + 0.8, 3.3, 1.9, bootC, "rgba(0,0,0,0.5)", 0.8);
    limb(ctx, 3, y0, rx, ry, 4.2, legC);
    ell(ctx, rx + 1.2, ry + 0.8, 3.3, 1.9, bootC, "rgba(0,0,0,0.5)", 0.8);
  }

  function quadLegs(ctx, s, furC, pawC, y0 = 8) {
    const pts = [[-11, -s * 5.2], [-5, s * 4.6], [4, -s * 4.6], [10, s * 5.2]];
    pts.forEach(([bx, dx]) => {
      limb(ctx, bx, y0, bx + dx, y0 + 11 - Math.abs(dx) * 0.25, 3.6, furC);
      ell(ctx, bx + dx + 1, y0 + 11.5, 2.8, 1.6, pawC);
    });
  }

  function drawSword(ctx, x, y, len, ang, c1 = "#f5fbff", c2 = "#7e90a8", hilt = "#e6b83e", glow = null) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    if (glow) { ctx.strokeStyle = glow; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, -len); ctx.stroke(); }
    const g = ctx.createLinearGradient(-2.5, 0, 2.5, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    poly(ctx, [[-2.1, -2], [-1.7, -len + 4], [0, -len - 2], [1.7, -len + 4], [2.1, -2]], g, "rgba(0,0,0,0.45)", 0.7);
    ctx.fillStyle = hilt; ctx.fillRect(-5.2, -3, 10.4, 2.6);
    ctx.fillStyle = "#4d2f18"; ctx.fillRect(-1.3, -0.5, 2.6, 5);
    circ(ctx, 0, 5, 1.8, hilt);
    ctx.restore();
  }

  // ===== 4 ГЕРОЯ, ЛИЧ БОРОДИН И 5 ПОДЧИНЁННЫХ НА КРИВЫХ БЕЗЬЕ =====
  function drawCharacter(ctx, x, y, sc, visual, opts = {}) {
    const facing = opts.facing || 1, dead = !!opts.dead, swing = opts.swing || 0;
    const walk = opts.walk || 0, t = nowT();
    const ph = opts.phase !== undefined ? opts.phase : t * (walk ? 13 : 2.8);

function findPath(hero, gx, gy) {

  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
    const cur = open.splice(bi, 1)[0];
    const ck = key(cur.x, cur.y);
    if (ck === goal) {
      const path = [];
      let k = ck;
      while (k !== start) {
        path.push({ x: k % G.w, y: Math.floor(k / G.w) });
        k = came.get(k);

      return path.reverse();

    closed.add(ck);

      if (closed.has(nk) || !isWalkableTile(nx, ny)) continue;
      if (nk !== goal) {
